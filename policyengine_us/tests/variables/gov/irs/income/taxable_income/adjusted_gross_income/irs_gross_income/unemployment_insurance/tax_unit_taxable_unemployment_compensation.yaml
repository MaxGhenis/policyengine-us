# 26 USC 85(c)(1) excludes up to $10,200 of 2020 unemployment compensation
# only if modified AGI is strictly less than $150,000. Modified AGI leaves out
# the unemployment compensation (IRC 85(c)(2)(B); 2020 Unemployment
# Compensation Exclusion Worksheet, lines 1 to 6).
- name: No exclusion in 2020 when modified AGI exceeds the $150,000 cutoff
  period: 2020
  input:
    people:
      head:
        age: 40
        employment_income: 155_000
        unemployment_compensation: 5_000
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    marital_units:
      marital_unit:
        members: [head]
    families:
      family:
        members: [head]
    spm_units:
      spm_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: TX
  output:
    # Modified AGI is the $155,000 of wages, not below the cutoff, so all
    # unemployment compensation is taxable.
    tax_unit_taxable_unemployment_compensation: 5_000

- name: No exclusion in 2020 when modified AGI is over the cutoff by less than the compensation
  period: 2020
  input:
    people:
      head:
        age: 40
        employment_income: 154_999
        unemployment_compensation: 5_000
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    marital_units:
      marital_unit:
        members: [head]
    families:
      family:
        members: [head]
    spm_units:
      spm_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: TX
  output:
    # Modified AGI is the $154,999 of wages; the compensation is not
    # subtracted again, so there is no exclusion.
    tax_unit_taxable_unemployment_compensation: 5_000

- name: No exclusion in 2020 when modified AGI equals the $150,000 cutoff exactly
  period: 2020
  input:
    people:
      head:
        age: 40
        employment_income: 150_000
        unemployment_compensation: 5_000
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    households:
      household:
        members: [head]
        state_code: TX
  output:
    # Worksheet line 6 is $150,000, so line 7 stops the exclusion.
    tax_unit_taxable_unemployment_compensation: 5_000

- name: Full exclusion in 2020 when modified AGI is one dollar below the cutoff
  period: 2020
  input:
    people:
      head:
        age: 40
        employment_income: 149_999
        unemployment_compensation: 5_000
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    households:
      household:
        members: [head]
        state_code: TX
  output:
    tax_unit_taxable_unemployment_compensation: 0

- name: Joint filers each exclude up to $10,200 in 2020 (the Form 1040 instructions' example)
  period: 2020
  input:
    people:
      head:
        age: 40
        employment_income: 30_000
        unemployment_compensation: 20_000
      spouse:
        age: 40
        unemployment_compensation: 5_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: TX
  output:
    # The instructions exclude all of the spouse's $5,000 plus $10,200 of
    # the $20,000 paid to the other spouse: $15,200 of $25,000.
    tax_unit_taxable_unemployment_compensation: 9_800
    taxable_unemployment_compensation: [9_800, 0]

- name: One filer's exclusion is capped at $10,200 in 2020
  period: 2020
  input:
    people:
      head:
        age: 40
        unemployment_compensation: 25_000
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    households:
      household:
        members: [head]
        state_code: TX
  output:
    tax_unit_taxable_unemployment_compensation: 14_800

- name: A dependent's compensation stays off the head's 2020 exclusion
  period: 2020
  input:
    people:
      head:
        age: 35
        employment_income: 15_000
        unemployment_compensation: 12_000
      child:
        age: 8
        is_tax_unit_dependent: true
        unemployment_compensation: 10_000
    tax_units:
      tax_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    # The head excludes $10,200 of their own $12,000. The child's $10,000 is
    # on the child's own return, where it is all excluded.
    tax_unit_taxable_unemployment_compensation: 1_800
    taxable_unemployment_compensation: [1_800, 0]
    tax_exempt_unemployment_compensation: [10_200, 10_000]
    adjusted_gross_income: 16_800
    eitc: 3_584

- name: A dependent's negative compensation input does not change the head's
  period: 2025
  input:
    people:
      head:
        age: 35
        employment_income: 15_000
        unemployment_compensation: 12_000
      child:
        age: 8
        is_tax_unit_dependent: true
        unemployment_compensation: -20_000
    tax_units:
      tax_unit:
        members: [head, child]
    households:
      household:
        members: [head, child]
        state_code: TX
  output:
    tax_unit_taxable_unemployment_compensation: 12_000
    taxable_unemployment_compensation: [12_000, -20_000]
    adjusted_gross_income: 27_000
