- name: Couples filing separately receive their own capped amount
  absolute_error_margin: 0.01
  period: 2021
  input:
    people:
      person1: 
        long_term_capital_gains: -4_000
        is_tax_unit_head: true
      person2:
        long_term_capital_gains: -4_000
        is_tax_unit_head: false
    tax_units:
      tax_unit:
        members: [person1, person2]
        state_filing_status_if_married_filing_separately_on_same_return: SEPARATE
    households:
      household:
        members: [person1, person2]
        state_fips: 5  # AR
  output:  # expected results from filing out 2021 AR1000D form
    ar_taxable_capital_gains_indiv: [-1_500, -1_500]

- name: Couples filing separately receive their own capped amount, the amount is not summed up
  absolute_error_margin: 0.01
  period: 2021
  input:
    people:
      person1: 
        long_term_capital_gains: -4_000
        is_tax_unit_head: true
      person2:
        long_term_capital_gains: -1_000
        is_tax_unit_head: false
    tax_units:
      tax_unit:
        members: [person1, person2]
        state_filing_status_if_married_filing_separately_on_same_return: SEPARATE
    households:
      household:
        members: [person1, person2]
        state_fips: 5  # AR
  output:  # expected results from filing out 2021 AR1000D form
    ar_taxable_capital_gains_indiv: [-1_500, -1_000]

# Ark. Code 26-51-815; 2025 AR1000D. The AR1000D is completed for a gain
# reported on federal Form 1040 line 7 when Schedule D is not required, its
# line 1 takes that amount as long-term gain, and line 8 taxes 50% of the net
# gain, so capital gain distributions reported without Schedule D are 50%
# taxable.
- name: Capital gain distributions reported without Schedule D, 50% taxable
  period: 2025
  input:
    state_code: AR
    non_sch_d_capital_gains: 2_000
    state_filing_status_if_married_filing_separately_on_same_return: SINGLE
  output:
    ar_taxable_capital_gains_indiv: 1_000  # = 2_000 * 0.5
    ar_gross_income_indiv: 1_000

- name: Short-term loss nets against capital gain distributions on AR1000D line 7a
  period: 2025
  input:
    state_code: AR
    non_sch_d_capital_gains: 2_000
    short_term_capital_gains: -800
    state_filing_status_if_married_filing_separately_on_same_return: SINGLE
  output:
    ar_taxable_capital_gains_indiv: 600  # = (2_000 - 800) * 0.5

- name: No Arkansas taxable capital gain for distributions outside Arkansas
  period: 2025
  input:
    state_code: TX
    non_sch_d_capital_gains: 2_000
  output:
    ar_taxable_capital_gains_indiv: 0
