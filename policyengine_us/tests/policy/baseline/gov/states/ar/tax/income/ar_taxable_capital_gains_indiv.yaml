  input:
    state_code: AR
    long_term_capital_gains: 2_000
    short_term_capital_gains: 1_000
    state_filing_status_if_married_filing_separately_on_same_return: SINGLE
  output:
    ar_taxable_capital_gains_indiv: 2_000

