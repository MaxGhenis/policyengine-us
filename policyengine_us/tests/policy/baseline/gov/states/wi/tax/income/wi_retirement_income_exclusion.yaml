- name: Exclusion beneficial - no credits, Line 16 reduces tax
  # Standard net tax 350 - 0 = 350 > exclusion tax 70, so the return
  # claims line 16: before refundable credits 70, refundable 0, net 70.
  absolute_error_margin: 0.01
  period: 2025
  input:
    age: 68
    taxable_pension_income: 8_000
    is_tax_unit_head: true
    filing_status: SINGLE
    state_code: WI
    wi_taxable_income: 10_000
    wi_income_tax_before_credits: 350
    wi_property_tax_credit_potential: 0
    wi_retirement_income_exclusion_tax: 70
    wi_earned_income_credit_potential: 0
    wi_homestead_credit_potential: 0
    wi_retirement_income_subtraction: 0
  output:
    wi_retirement_income_exclusion_claimed: true
    wi_income_tax_before_refundable_credits: 70
    wi_refundable_credits: 0
    wi_income_tax: 70

- name: Exclusion NOT beneficial - refundable credits make standard path better
  # Standard net tax 350 - 300 = 50 < exclusion tax 280, so the return does
  # not claim line 16: before refundable credits 350, refundable 300, net 50.
  absolute_error_margin: 0.01
  period: 2025
  input:
    age: 68
    taxable_pension_income: 2_000
    is_tax_unit_head: true
    filing_status: SINGLE
    state_code: WI
    wi_taxable_income: 10_000
    wi_income_tax_before_credits: 350
    wi_property_tax_credit_potential: 0
    wi_retirement_income_exclusion_tax: 280
    wi_earned_income_credit_potential: 0
    wi_homestead_eligible: true
    wi_homestead_credit_potential: 300
    wi_retirement_income_subtraction: 0
  output:
    wi_retirement_income_exclusion_claimed: false
    wi_income_tax_before_refundable_credits: 350
    wi_refundable_credits: 300
    wi_income_tax: 50

