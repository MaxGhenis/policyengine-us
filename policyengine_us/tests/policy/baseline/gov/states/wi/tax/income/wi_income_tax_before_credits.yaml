# 2025 Act 15 bracket tops, corroborated by 2025 Form 1-ES, PDF page 4.
- name: WI 2025 single third bracket starts at the statutory amount
  period: 2025
  absolute_error_margin: 0.01
  input:
    state_code: WI
    filing_status: SINGLE
    wi_taxable_income: 51_000
  output:
    # 2,089.00 + (51,000 - 50,480) * 5.3%.
    wi_income_tax_before_credits: 2_116.56

