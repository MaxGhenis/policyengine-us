    wi_property_tax_credit_potential: 50
    wi_earned_income_credit_potential: 20
    wi_homestead_eligible: true
    wi_homestead_credit_potential: 30
  output:
    wi_retirement_income_exclusion_claimed: false
    wi_property_tax_credit: 50
    wi_income_tax_before_refundable_credits: 300
    wi_earned_income_credit: 20
    wi_homestead_credit: 30
    wi_refundable_credits: 50
    wi_income_tax: 250

