# Form FTB 3526, line 8. Each case writes out the form lines.

- name: Net investment income below investment interest; the excess carries forward.
  period: 2025
  input:
    people:
      person1:
        taxable_interest_income: 6_000
        qualified_dividend_income: 1_500
        non_qualified_dividend_income: 500
        long_term_capital_gains: 10_000
        short_term_capital_gains: 3_000
        investment_interest_expense: 12_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    # Line 1 = 12,000; line 2 = 0; line 3 = 12,000.
    # Line 4a = 6,000 interest + 2,000 dividends (qualified ones included) = 8,000.
    # Line 4b = 10,000 + 3,000 = 13,000; line 4c = 10,000; line 4d = 3,000.
    # Line 4e = 0 (no election); line 4f = 8,000 + 3,000 = 11,000.
    ca_investment_income_ftb_3526: 11_000
    # Line 5 = 0; line 6 = 11,000.
    ca_investment_expenses_ftb_3526: 0
    # Line 8 = smaller of line 3 (12,000) or line 6 (11,000).
    ca_investment_interest_expense_deduction: 11_000
    # Line 7 = 12,000 - 11,000.
    ca_disallowed_investment_interest_expense: 1_000

- name: Elected net capital gain counts as investment income (line 4e).
  period: 2025
  input:
    people:
      person1:
        taxable_interest_income: 6_000
        qualified_dividend_income: 1_500
        non_qualified_dividend_income: 500
        long_term_capital_gains: 10_000
        short_term_capital_gains: 3_000
        investment_income_elected_form_4952: 4_000
        investment_interest_expense: 12_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    # Line 4e = 4,000 (no more than line 4c 10,000 or line 4b 13,000).
    # Line 4f = 8,000 + 3,000 + 4,000 = 15,000.
    ca_investment_income_ftb_3526: 15_000
    # Line 8 = smaller of 12,000 or 15,000; line 7 = 0.
    ca_investment_interest_expense_deduction: 12_000
    ca_disallowed_investment_interest_expense: 0

- name: Election above net capital gain is limited to line 4c.
  period: 2025
  input:
    people:
      person1:
        long_term_capital_gains: 5_000
        short_term_capital_gains: -2_000
        investment_income_elected_form_4952: 9_000
        investment_interest_expense: 8_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    # Line 4b = 5,000 - 2,000 = 3,000; line 4c = 5,000 - 2,000 = 3,000.
    # Line 4d = 0; line 4e = 3,000; line 4f = 3,000.
    ca_investment_income_ftb_3526: 3_000
    ca_investment_interest_expense_deduction: 3_000
    ca_disallowed_investment_interest_expense: 5_000

- name: Capital gain distributions without Schedule D are long-term gains.
  period: 2025
  input:
    people:
      person1:
        non_sch_d_capital_gains: 2_000
        short_term_capital_gains: 1_000
        investment_interest_expense: 5_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    # Line 4b = 3,000; line 4c = 2,000; line 4d = 1,000; line 4f = 1,000.
    ca_investment_income_ftb_3526: 1_000
    ca_investment_interest_expense_deduction: 1_000

- name: Investment expenses reduce investment income after the 2% AGI floor (line 5).
  period: 2025
  input:
    people:
      person1:
        taxable_interest_income: 20_000
        investment_expenses: 3_000
        investment_interest_expense: 25_000
    tax_units:
      tax_unit:
        members: [person1]
        adjusted_gross_income: 100_000
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    # Schedule CA Part II line 21 = 3,000; line 22 = 3,000.
    # Line 24 = 2% x 100,000 = 2,000; line 25 = 1,000.
    # FTB 3526 line 5 = smaller of 3,000 or 1,000.
    ca_investment_expenses_ftb_3526: 1_000
    # Line 6 = 20,000 - 1,000; line 8 = smaller of 25,000 or 19,000.
    ca_investment_interest_expense_deduction: 19_000
    ca_disallowed_investment_interest_expense: 6_000

- name: Other miscellaneous expenses absorb the AGI floor first.
  period: 2025
  input:
    people:
      person1:
        taxable_interest_income: 20_000
        investment_expenses: 3_000
        tax_preparation_fees: 1_500
        investment_interest_expense: 25_000
    tax_units:
      tax_unit:
        members: [person1]
        adjusted_gross_income: 100_000
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    # Line 22 = 3,000 + 1,500 = 4,500; line 25 = 4,500 - 2,000 = 2,500.
    # Line 5 = smaller of 3,000 or 2,500.
    ca_investment_expenses_ftb_3526: 2_500
    ca_investment_interest_expense_deduction: 17_500

- name: Investment expenses above investment income allow no deduction.
  period: 2025
  input:
    people:
      person1:
        taxable_interest_income: 2_000
        investment_expenses: 9_000
        investment_interest_expense: 10_000
    tax_units:
      tax_unit:
        members: [person1]
        adjusted_gross_income: 50_000
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    # Line 25 = 9,000 - 1,000 = 8,000; line 5 = 8,000.
    ca_investment_expenses_ftb_3526: 8_000
    # Line 6 = 2,000 - 8,000 is negative, so no deduction; line 7 = 10,000.
    ca_investment_interest_expense_deduction: 0
    ca_disallowed_investment_interest_expense: 10_000

- name: Prior-year disallowed interest enters line 2.
  period: 2025
  input:
    people:
      person1:
        taxable_interest_income: 10_000
        investment_interest_expense: 2_000
    tax_units:
      tax_unit:
        members: [person1]
        ca_disallowed_investment_interest_expense_prior_year: 3_000
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    # Line 3 = 2,000 + 3,000 = 5,000; line 6 = 10,000; line 8 = 5,000.
    ca_investment_interest_expense_deduction: 5_000
    ca_disallowed_investment_interest_expense: 0

- name: No investment interest, no deduction.
  period: 2025
  input:
    people:
      person1:
        taxable_interest_income: 10_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_investment_interest_expense_deduction: 0
    ca_disallowed_investment_interest_expense: 0
