- name: Case 1, net investment income below investment interest.
  period: 2026
  input:
    state_code: CA
    investment_interest_expense: 10_000
    investment_expenses: 2_000
  output:
    ca_investment_interest_expense_deduction: 8_000

- name: Case 2, investment expenses exceed investment interest.
  period: 2026
  input:
    state_code: CA
    investment_interest_expense: 10_000
    investment_expenses: 12_000
  output:
    ca_investment_interest_expense_deduction: 0

# FTB 3526, line 5, includes the smaller of the investment expenses on
# Schedule CA (540), Part II, line 21 or the line 25 total, because the 2%
# floor on line 24 may reduce them. The 2021 and 2025 instructions agree.
# https://www.ftb.ca.gov/forms/2021/2021-3526.pdf#page=2
# https://www.ftb.ca.gov/forms/2025/2025-3526.pdf#page=2
- name: Investment expenses the two percent floor absorbs do not reduce net investment income
  period: 2026
  input:
    state_code: CA
    adjusted_gross_income: 100_000
    investment_interest_expense: 10_000
    investment_expenses: 2_000
  output:
    # Line 25: max(0, 2,000 - 0.02 * 100,000) = 0, so line 5 is 0.
    ca_misc_deduction: 0
    ca_investment_interest_expense_deduction: 10_000

- name: Only investment expenses above the two percent floor reduce net investment income
  period: 2021
  input:
    state_code: CA
    adjusted_gross_income: 100_000
    investment_interest_expense: 10_000
    investment_expenses: 3_000
  output:
    # Line 25: 3,000 - 2,000 = 1,000. Line 5: min(3,000, 1,000).
    ca_misc_deduction: 1_000
    # Line 8: min(10,000, 10,000 - 1,000).
    ca_investment_interest_expense_deduction: 9_000

- name: Other miscellaneous expenses absorb the floor before investment expenses
  period: 2026
  input:
    state_code: CA
    adjusted_gross_income: 100_000
    investment_interest_expense: 10_000
    investment_expenses: 3_000
    unreimbursed_business_employee_expenses: 2_500
  output:
    # Line 25: 3,000 + 2,500 - 2,000 = 3,500. Line 5: min(3,000, 3,500).
    ca_misc_deduction: 3_500
    ca_investment_interest_expense_deduction: 7_000

- name: FTB 3526 investment interest deduction is restricted to California tax units
  period: 2026
  input:
    state_code: [CA, NY]
    adjusted_gross_income: [100_000, 100_000]
    investment_interest_expense: [10_000, 10_000]
    investment_expenses: [3_000, 3_000]
  output:
    ca_investment_interest_expense_deduction: [9_000, 0]
