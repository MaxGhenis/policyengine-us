- name: Case 1, investment interest is not counted twice.
  period: 2026
  input:
    state_code: CA
    investment_interest_expense: 10_000
  output:
    ca_itemized_deductions_pre_limitation: 10_000

- name: Case 2, California investment interest replaces federal investment interest.
  period: 2026
  input:
    state_code: CA
    investment_interest_expense: 10_000
    investment_expenses: 2_000
    real_estate_taxes: 5_000
  output:
    ca_itemized_deductions_pre_limitation: 13_000

# 2024 Schedule CA (540) instructions, line 15 (Form 540 booklet, PDF p. 66):
# "California law does not conform" to the federal limit of personal casualty
# losses to declared disasters; filers complete a second Form 4684 with
# California amounts.
- name: Case 3, California allows a non-disaster casualty loss the federal return does not.
  period: 2024
  input:
    state_code: CA
    employment_income: 100_000
    casualty_loss: 15_000
  output:
    casualty_loss_deduction: 0
    # Form 4684: (15,000 - 100) - 10% x 100,000 = 4,900
    ca_itemized_deductions_pre_limitation: 4_900

- name: Case 4, the casualty loss counts once when the federal suspension is lifted.
  period: 2024
  input:
    gov.irs.deductions.itemized.casualty.active: true
    state_code: CA
    employment_income: 100_000
    casualty_loss: 15_000
  output:
    casualty_loss_deduction: 4_900
    ca_casualty_loss_deduction: 4_900
    # The federal 4,900 inside itemized_deductions_less_salt is replaced by
    # California's 4,900, not added to it.
    ca_itemized_deductions_pre_limitation: 4_900
