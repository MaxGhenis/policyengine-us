- name: California Alternative Minimum Taxable Income total adjustments - 2021 filer itemizes deductions
  period: 2021
  input:
    state_code: CA
    ca_itemized_deductions: 10_000
    ca_standard_deduction: 5_000
    medical_expense_deduction: 1_000 
    real_estate_taxes: 6_000 
    mortgage_interest: 0 
    ca_misc_deduction: 0
    ca_investment_interest_deduction: 0
  output:
    ca_amti_adjustments: 7_000

- name: California Alternative Minimum Taxable Income total adjustments - 2021 filer doesn't itemizes deductions
  period: 2021
  input:
    state_code: CA
    ca_itemized_deductions: 0
    ca_standard_deduction: 5_000
    medical_expense_deduction: 1_000 
    real_estate_taxes: 6_000 
    mortgage_interest: 0 
    ca_misc_deduction: 0
    ca_investment_interest_deduction: 0
  output:
    ca_amti_adjustments: 5_000

- name: California Alternative Minimum Taxable Income total adjustments - 2022 filer itemizes deductions and invetsment interest
  period: 2022
  input:
    state_code: CA
    ca_itemized_deductions: 10_000
    ca_standard_deduction: 5_000
    medical_expense_deduction: 1_000 
    real_estate_taxes: 6_000 
    mortgage_interest: 0 
    ca_misc_deduction: 0
    ca_investment_interest_deduction: 500
  output:
    ca_amti_adjustments: 7_500

# Schedule P (540), Part I, line 5 adds back California miscellaneous
# itemized deductions, which R&TC 17076(c) permits despite IRC 67(g).
# https://www.ftb.ca.gov/forms/2025/2025-540-p.pdf#page=1
- name: California AMT adds back the miscellaneous deduction allowed by California
  period: 2026
  input:
    state_code: CA
    adjusted_gross_income: 100_000
    unreimbursed_business_employee_expenses: 3_000
    ca_itemized_deductions: 10_000
    ca_standard_deduction: 5_000
    medical_expense_deduction: 0
    real_estate_taxes: 0
    ca_investment_interest_deduction: 0
  output:
    misc_deduction: 0
    ca_misc_deduction: 1_000
    ca_amti_adjustments: 1_000

- name: California AMT adds back only the standard deduction for a nonitemizer with miscellaneous expenses
  period: 2026
  input:
    state_code: CA
    adjusted_gross_income: 100_000
    unreimbursed_business_employee_expenses: 3_000
    ca_itemized_deductions: 1_000
    ca_standard_deduction: 5_000
    medical_expense_deduction: 0
    real_estate_taxes: 0
    ca_investment_interest_deduction: 0
  output:
    misc_deduction: 0
    ca_misc_deduction: 1_000
    ca_amti_adjustments: 5_000
