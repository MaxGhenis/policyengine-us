# Schedule P (540) line 7: regular tax form FTB 3526 line 8 less the AMT
# form FTB 3526 line 8.

- name: Investment expenses are not allowed for AMT, so the AMT deduction is larger.
  period: 2025
  input:
    people:
      person1:
        taxable_interest_income: 20_000
        investment_expenses: 15_000
        investment_interest_expense: 10_000
    tax_units:
      tax_unit:
        members: [person1]
        adjusted_gross_income: 100_000
        ca_itemized_deductions: 20_000
        ca_standard_deduction: 5_000
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    # Regular: line 25 = 15,000 - 2,000 = 13,000; line 5 = 13,000;
    # line 6 = 7,000; line 8 = 7,000.
    ca_investment_interest_expense_deduction: 7_000
    # AMT: line 5 = 0; line 6 = 20,000; line 8 = 10,000.
    ca_amt_investment_interest_expense_deduction: 10_000
    # Line 7 = 7,000 - 10,000, entered as a negative amount.
    ca_amt_investment_interest_adjustment: -3_000

- name: No adjustment when the filer does not itemize.
  period: 2025
  input:
    people:
      person1:
        taxable_interest_income: 20_000
        investment_expenses: 15_000
        investment_interest_expense: 10_000
    tax_units:
      tax_unit:
        members: [person1]
        adjusted_gross_income: 100_000
        ca_itemized_deductions: 4_000
        ca_standard_deduction: 5_000
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_amt_investment_interest_adjustment: 0

- name: AMT carryover can make the AMT deduction larger.
  period: 2025
  input:
    people:
      person1:
        taxable_interest_income: 20_000
        investment_interest_expense: 5_000
    tax_units:
      tax_unit:
        members: [person1]
        ca_disallowed_investment_interest_expense_prior_year: 1_000
        ca_amt_disallowed_investment_interest_expense_prior_year: 4_000
        ca_itemized_deductions: 20_000
        ca_standard_deduction: 5_000
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    # Regular line 3 = 6,000 = line 8; AMT line 3 = 9,000 = line 8.
    ca_investment_interest_expense_deduction: 6_000
    ca_amt_investment_interest_expense_deduction: 9_000
    ca_amt_investment_interest_adjustment: -3_000

- name: Investment interest within investment income needs no AMT adjustment.
  period: 2025
  input:
    people:
      person1:
        taxable_interest_income: 20_000
        investment_interest_expense: 10_000
    tax_units:
      tax_unit:
        members: [person1]
        ca_itemized_deductions: 20_000
        ca_standard_deduction: 5_000
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    ca_amt_investment_interest_adjustment: 0
    # The adjustment is zero, so AMT adjustments are medical (0), property
    # taxes (0) and miscellaneous (0) deductions only.
    ca_amti_adjustments: 0
