- name: Pre capital gains subtraction law
  period: 2024
  absolute_error_margin: 0
  input:
    people:
      person1:
        long_term_capital_gains: 1_000
        short_term_capital_gains: 500
    tax_units:
      tax_unit1:
        members: [person1]
        tax_unit_itemizes: false
        taxable_income: 100_000
    households:
      household1:
        members: [person1]
        state_code: MO
  output:
    mo_capital_gains_subtraction: 0

- name: Post capital gains subtraction law
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person1:
        long_term_capital_gains: 1_000
        short_term_capital_gains: 500
    tax_units:
      tax_unit1:
        members: [person1]
        tax_unit_itemizes: false
        taxable_income: 100_000
    households:
      household1:
        members: [person1]
        state_code: MO
  output:
    mo_capital_gains_subtraction: 1_500

- name: Post capital gains subtraction law - married couple
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person1:
        long_term_capital_gains: 6_000
        short_term_capital_gains: 0
      person2:
        long_term_capital_gains: 4_000
        short_term_capital_gains: 0
    tax_units:
      tax_unit1:
        members: [person1, person2]
        tax_unit_itemizes: false
        taxable_income: 100_000
    households:
      household1:
        members: [person1, person2]
        state_code: MO
  output:
    # Tax unit level subtraction should be full 10_000
    mo_capital_gains_subtraction: 10_000
    # Person level subtraction should be allocated by LTCG share
    mo_capital_gains_subtraction_person: [6_000, 4_000]

- name: 2025 capital gains subtraction - 100% of LTCG
  # In 2025, 100% of federally reported capital gains are subtractable
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person1:
        long_term_capital_gains: 25_000
        short_term_capital_gains: 5_000
    tax_units:
      tax_unit1:
        members: [person1]
        tax_unit_itemizes: false
        taxable_income: 150_000
    households:
      household1:
        members: [person1]
        state_code: MO
  output:
    # 100% of both short-term and long-term capital gains are subtracted
    mo_capital_gains_subtraction: 30_000

- name: 2025 capital gains subtraction allocates only to positive-gain spouse
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person1:
        long_term_capital_gains: 10_000
        short_term_capital_gains: 0
      person2:
        long_term_capital_gains: 0
        short_term_capital_gains: -2_000
    tax_units:
      tax_unit1:
        members: [person1, person2]
        tax_unit_itemizes: false
        taxable_income: 100_000
    households:
      household1:
        members: [person1, person2]
        state_code: MO
  output:
    mo_capital_gains_subtraction: 8_000
    mo_capital_gains_subtraction_person: [8_000, 0]

# RSMo 143.121.3(14)(a) subtracts 100% of income reported as a capital gain
# for federal purposes; Form MO-A line 18 takes federal Form 1040 line 7a,
# which includes capital gain distributions reported without Schedule D.
- name: Capital gain distributions reported without Schedule D
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person1:
        non_sch_d_capital_gains: 1_000
    tax_units:
      tax_unit1:
        members: [person1]
    households:
      household1:
        members: [person1]
        state_code: MO
  output:
    mo_capital_gains_subtraction: 1_000
    mo_capital_gains_subtraction_person: [1_000]

- name: Distributions and Schedule D gains allocated to each spouse
  period: 2025
  absolute_error_margin: 0
  input:
    people:
      person1:
        non_sch_d_capital_gains: 1_000
      person2:
        long_term_capital_gains: 3_000
    tax_units:
      tax_unit1:
        members: [person1, person2]
    households:
      household1:
        members: [person1, person2]
        state_code: MO
  output:
    mo_capital_gains_subtraction: 4_000
    mo_capital_gains_subtraction_person: [1_000, 3_000]

- name: No subtraction for distributions before 2025
  period: 2024
  absolute_error_margin: 0
  input:
    people:
      person1:
        non_sch_d_capital_gains: 1_000
    tax_units:
      tax_unit1:
        members: [person1]
    households:
      household1:
        members: [person1]
        state_code: MO
  output:
    mo_capital_gains_subtraction: 0
