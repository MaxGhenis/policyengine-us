- name: Reduced single threshold
  period: 2024
  input:
    long_term_capital_gains: 2_000
    mt_taxable_income_joint: 2_500
    filing_status: SINGLE
    state_code: MT
  output:
    mt_capital_gains_tax_applicable_threshold_joint: 20_000 

- name: No nonqualified income
  period: 2024
  input:
    long_term_capital_gains: 2_000
    mt_taxable_income_joint: 1_000
    filing_status: SINGLE
    state_code: MT
  output:
    mt_capital_gains_tax_applicable_threshold_joint: 20_500

- name: Negative threshold, capped at 0
  period: 2024
  input:
    long_term_capital_gains: 2_000
    mt_taxable_income_joint: 40_000
    filing_status: HEAD_OF_HOUSEHOLD
    state_code: MT
  output:
    mt_capital_gains_tax_applicable_threshold_joint: 0

- name: Joint amount
  period: 2024
  input:
    long_term_capital_gains: 2_000
    mt_taxable_income_joint: 40_000
    filing_status: JOINT
    state_code: MT
  output:
    mt_capital_gains_tax_applicable_threshold_joint: 3_000

- name: Short-term losses reduce the remaining joint CG threshold
  period: 2024
  input:
    long_term_capital_gains: 50_000
    short_term_capital_gains: -20_000
    mt_taxable_income_joint: 40_000
    filing_status: JOINT
    state_code: MT
  output:
    mt_capital_gains_tax_applicable_threshold_joint: 31_000

# MCA 15-30-2103 defines net long-term capital gains by IRC 1222, and
# capital gain distributions are long-term gain (26 U.S.C. 852(b)(3)(B)).
# Form 2 line 2 takes federal Form 1040 line 7 when Schedule D is not
# required (2024 Form 2 instructions, page 11, PDF page 19), so distributions
# reported without Schedule D count.
- name: Capital gain distributions reported without Schedule D are not nonqualified income
  period: 2024
  input:
    non_sch_d_capital_gains: 2_000
    mt_taxable_income_joint: 2_500
    filing_status: SINGLE
    state_code: MT
  output:
    mt_capital_gains_tax_applicable_threshold_joint: 20_000  # = 20_500 - (2_500 - 2_000)
