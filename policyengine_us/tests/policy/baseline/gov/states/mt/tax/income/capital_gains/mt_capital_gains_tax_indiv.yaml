- name: Indiv path disabled in 2024 (MFSS repealed)
  period: 2024
  input:
    long_term_capital_gains: 1_000
    mt_capital_gains_tax_applicable_threshold_indiv: 0
    state_filing_status_if_married_filing_separately_on_same_return: SINGLE
    state_code: MT
  output:
    mt_capital_gains_tax_indiv: 0

- name: Capital gains tax not in effect before 2024
  period: 2023
  input:
    long_term_capital_gains: 1_000
    mt_capital_gains_tax_applicable_threshold_indiv: 2_000
    state_filing_status_if_married_filing_separately_on_same_return: SEPARATE
    state_code: MT
  output:
    mt_capital_gains_tax_indiv: 0

- name: Indiv CG tax uses net LTCG after STCG losses when MFSS is enabled
  period: 2024
  reforms: policyengine_us.tests.policy.baseline.gov.states.mt.tax.income.enable_mt_mfss_2024_reform.enable_mt_mfss_2024_reform
  input:
    people:
      person1:
        long_term_capital_gains: 50_000
        short_term_capital_gains: -20_000
        mt_capital_gains_tax_applicable_threshold_indiv: 10_000
      person2:
        long_term_capital_gains: 0
        short_term_capital_gains: 0
        mt_capital_gains_tax_applicable_threshold_indiv: 20_500
    tax_units:
      tax_unit:
        members: [person1, person2]
        state_filing_status_if_married_filing_separately_on_same_return: SEPARATE
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    mt_capital_gains_tax_indiv: [1_120, 0]

# MCA 15-30-2103 defines net long-term capital gains by IRC 1222, and
# capital gain distributions are long-term gain (26 U.S.C. 852(b)(3)(B)).
# Form 2 line 2 takes federal Form 1040 line 7 when Schedule D is not
# required (2024 Form 2 instructions, page 11, PDF page 19), so distributions
# reported without Schedule D count.
- name: Capital gain distributions reported without Schedule D when MFSS is enabled
  period: 2024
  reforms: policyengine_us.tests.policy.baseline.gov.states.mt.tax.income.enable_mt_mfss_2024_reform.enable_mt_mfss_2024_reform
  input:
    people:
      person1:
        non_sch_d_capital_gains: 30_000
        mt_capital_gains_tax_applicable_threshold_indiv: 10_000
      person2:
        mt_capital_gains_tax_applicable_threshold_indiv: 20_500
    tax_units:
      tax_unit:
        members: [person1, person2]
        state_filing_status_if_married_filing_separately_on_same_return: SEPARATE
    households:
      household:
        members: [person1, person2]
        state_code: MT
  output:
    # 10_000 * 0.03 + 20_000 * 0.041 = 300 + 820
    mt_capital_gains_tax_indiv: [1_120, 0]
