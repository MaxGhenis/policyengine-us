- name: Spouse's loss reduces the joint return's Montana AGI before the floor
  period: 2022
  absolute_error_margin: 1
  input:
    people:
      head:
        age: 40
        employment_income: 100_000
        other_medical_expenses: 10_000
      spouse:
        age: 40
        self_employment_income: -20_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: MT
  output:
    # Form 2 page 1, line 14: 100,000 - 20,000 = 80,000, reported in one column.
    mt_agi_joint: 80_000
    # Itemized Deductions Schedule line 1: 10,000 - 7.5% x 80,000 = 4,000.
    # Flooring each spouse's Montana AGI at zero first would give
    # 10,000 - 7.5% x 90,000 = 3,250.
    mt_medical_expense_deduction_joint: [4_000, 0]

- name: Last year of the Montana schedule floors on Montana AGI, not the federal deduction
  period: 2023
  absolute_error_margin: 1
  input:
    people:
      person1:
        is_tax_unit_head: true
        other_medical_expenses: 10_000
    tax_units:
      tax_unit:
        members: [person1]
        mt_agi_joint: 40_000
        medical_expense_deduction: 9_999
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    # 10,000 - 7.5% x 40,000 = 7,000
    mt_medical_expense_deduction_joint: 7_000

- name: From 2024 the federal medical expense deduction carries through
  period: 2024
  absolute_error_margin: 1
  input:
    people:
      person1:
        is_tax_unit_head: true
        other_medical_expenses: 10_000
    tax_units:
      tax_unit:
        members: [person1]
        mt_agi_joint: 50_000
        medical_expense_deduction: 2_500
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    mt_medical_expense_deduction_joint: 2_500

- name: From 2024 the floor uses federal AGI, not Montana AGI
  period: 2024
  absolute_error_margin: 1
  input:
    people:
      person1:
        age: 70
        medicare_enrolled: false
        employment_income: 100_000
        other_medical_expenses: 10_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    # PE's mt_agi_joint takes off the $5,500 subtraction for taxpayers 65 and
    # older. From 2024 Form 2 applies it to federal taxable income instead,
    # and has no Montana AGI line.
    adjusted_gross_income: 100_000
    mt_agi_joint: 94_500
    # Form 2 line 2, Worksheet A, takes federal Schedule A:
    # 10,000 - 7.5% x 100,000 = 2,500.
    mt_medical_expense_deduction_joint: 2_500

- name: A dependent's U.S. government interest does not lower the parents' Montana AGI
  period: 2022
  absolute_error_margin: 1
  input:
    people:
      head:
        age: 40
        employment_income: 50_000
        other_medical_expenses: 10_000
      spouse:
        age: 40
      child:
        age: 10
        taxable_interest_income: 10_000
        us_govt_interest_person: 10_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    households:
      household:
        members: [head, spouse, child]
        state_code: MT
  output:
    # The child's interest is on the child's own return, so it is neither in
    # the parents' federal AGI nor subtracted on their Montana return.
    mt_agi_joint: 50_000
    # 10,000 - 7.5% x 50,000 = 6,250
    mt_medical_expense_deduction_joint: [6_250, 0, 0]

- name: In 2026 the federal floor applies to federal AGI
  period: 2026
  absolute_error_margin: 1
  input:
    people:
      person1:
        age: 40
        employment_income: 100_000
        other_medical_expenses: 11_000
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: MT
  output:
    # 11,000 - 7.5% x 100,000 = 3,500
    mt_medical_expense_deduction_joint: 3_500
