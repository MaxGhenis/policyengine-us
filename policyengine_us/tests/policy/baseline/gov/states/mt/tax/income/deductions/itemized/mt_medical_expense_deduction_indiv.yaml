- name: Test case 1, medical_expense higher than 0.075 of agi.
  period: 2021
  input:
     other_medical_expenses: 1_000
     mt_agi_indiv: 10_000
     state_code: MT
     is_tax_unit_head_or_spouse: true
  output:
     mt_medical_expense_deduction_indiv: 250

- name: Test case 21, medical_expense less than 0.075 of agi.
  period: 2021
  input:
     other_medical_expenses: 1_000
     mt_agi_indiv: 20_000
     state_code: MT
     is_tax_unit_head_or_spouse: true
  output:
     mt_medical_expense_deduction_indiv: 0

- name: Not head or spouse ineligible
  period: 2021
  input:
     other_medical_expenses: 1_000
     mt_agi_indiv: 0
     state_code: MT
     is_tax_unit_head_or_spouse: false
  output:
     mt_medical_expense_deduction_indiv: 0

- name: Each spouse filing separately on the same form uses their own column's Montana AGI
  period: 2022
  input:
     other_medical_expenses: 10_000
     mt_agi_indiv: 60_000
     state_code: MT
     is_tax_unit_head_or_spouse: true
  output:
     # 10,000 - 7.5% x 60,000 = 5,500
     mt_medical_expense_deduction_indiv: 5_500
