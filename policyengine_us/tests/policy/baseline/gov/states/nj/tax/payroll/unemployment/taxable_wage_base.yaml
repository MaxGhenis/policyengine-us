    taxable_earnings_for_state_unemployment_tax: 31_500
    # 120.4875 + 13.3875 = 133.875, the UI/WF/SWF maximum in NJ Taxation's
    # 2014 W-2 notice (M-6025), which shows 133.88.
    nj_employee_unemployment_insurance_contribution: 120.4875
    nj_employee_health_care_subsidy_fund_contribution: 0
    nj_employee_workforce_fund_contribution: 13.3875
    nj_employee_state_payroll_tax: 133.875
    nj_employer_state_unemployment_tax: 1_071

