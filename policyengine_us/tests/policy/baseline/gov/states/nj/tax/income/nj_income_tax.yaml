# Joint filers, wages 60,000 and 20,000, one dependent child aged 15:
#   nj_agi 80,000; exemptions 2,000 regular + 1,500 dependent = 3,500;
#   taxable income 76,500; tax 280 + 525 + 2.45% x 20,000
#   + 3.5% x 6,500 = 280 + 525 + 490 + 227.50 = 1,522.50.
- name: Dependent income twin, joint filers with a child who has no income
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head: {age: 40, employment_income: 60_000}
      spouse: {age: 40, employment_income: 20_000}
      child: {age: 15}
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    households:
      household:
        members: [head, spouse, child]
        state_code: NJ
  output:
    nj_agi: 80_000
    nj_taxable_income: 76_500
    nj_income_tax: 1_522.5

