- name: PolicyBench scenario 008 includes New Jersey worker UI and workforce contributions in household payroll tax.
  period: 2026
  absolute_error_margin: 0.01
  # N.J.S.A. 43:21-7(d)(1), 34:15D-13, and 34:15D-22 impose employee
  # UI and WF/SWF contributions on wages, excluding self-employment income.
  # NJDOL rates: https://www.nj.gov/labor/ea/employer-services/rate-info/
  input:
    people:
      head:
        age: 42
        self_employment_income: 4_000
        employment_income: 0
        is_tax_unit_head: true
      spouse:
        age: 41
        employment_income: 26_800
        is_tax_unit_spouse: true
      child1:
        employment_income: 0
        is_tax_unit_dependent: true
      child2:
        employment_income: 0
        is_tax_unit_dependent: true
      child3:
        employment_income: 0
        is_tax_unit_dependent: true
      child4:
        employment_income: 0
        is_tax_unit_dependent: true
      child5:
        employment_income: 0
        is_tax_unit_dependent: true
      child6:
        employment_income: 0
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, spouse, child1, child2, child3, child4, child5, child6]
    spm_units:
      spm_unit:
        members: [head, spouse, child1, child2, child3, child4, child5, child6]
    households:
      household:
        members: [head, spouse, child1, child2, child3, child4, child5, child6]
        state_code: NJ
  output:
    nj_employee_unemployment_insurance_contribution: [0, 102.51, 0, 0, 0, 0, 0, 0]
    nj_employee_workforce_fund_contribution: [0, 11.39, 0, 0, 0, 0, 0, 0]
    nj_employee_state_payroll_tax: [0, 226.46, 0, 0, 0, 0, 0, 0]
    # Wages 26,800 * (6.2% Social Security + 1.45% Medicare) = 2,050.20.
    # Add state TDI 50.92, FLI 61.64, UI 102.51, and WF/SWF 11.39.
    # The employee payroll measure excludes the head's self-employment tax.
    employee_payroll_tax: 2_276.66
    spm_unit_payroll_tax: 2_276.66
