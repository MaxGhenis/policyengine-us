# The Unreimbursed Medical Care Expenses Worksheet (2025 instructions, p. 41)
# computes line 8 once for the return. Each person carries their share of it,
# in proportion to their line 5 expenses, so the return deducts it once.

- name: Joint couple and child, head has all the expenses
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 40_000
        other_medical_expenses: 6_000
      spouse:
        age: 38
        employment_income: 10_000
      child:
        age: 5
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse, child]
        state_code: OH
  output:
    # Line 5 = 6,000; line 6 = 50,000; line 7 = 50,000 * 0.075 = 3,750;
    # line 8 = 6,000 - 3,750 = 2,250, all of it the head's share.
    oh_insured_unreimbursed_medical_care_expenses: 2_250
    oh_insured_unreimbursed_medical_care_expenses_person: [2_250, 0, 0]
    oh_unreimbursed_medical_care_expense_deduction_person: [2_250, 0, 0]
    oh_unreimbursed_medical_care_expense_deduction: 2_250
    # 40,000 - 2,250; 10,000; 0.
    oh_agi_person: [37_750, 10_000, 0]
    # 50,000 - 2,250.
    oh_agi: 47_750

- name: Expenses for every member are prorated by each person's line 5 share
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 40_000
        other_medical_expenses: 3_000
      spouse:
        age: 38
        employment_income: 10_000
        other_medical_expenses: 1_000
      child:
        age: 5
        is_tax_unit_dependent: true
        other_medical_expenses: 2_000
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse, child]
        state_code: OH
  output:
    # Line 5 = 6,000; line 8 = 6,000 - 3,750 = 2,250.
    oh_insured_unreimbursed_medical_care_expenses: 2_250
    # 2,250 * 3/6, 2,250 * 1/6, 2,250 * 2/6.
    oh_unreimbursed_medical_care_expense_deduction_person: [1_125, 375, 750]
    oh_unreimbursed_medical_care_expense_deduction: 2_250
    oh_agi_person: [38_875, 9_625, -750]
    oh_agi: 47_750

- name: Uninsured and long-term care premiums stay with the person who paid them
  period: 2025
  input:
    people:
      head:
        age: 40
        employment_income: 40_000
        other_medical_expenses: 6_000
        health_insurance_premiums: 1_200
        employer_contribution_to_health_insurance_premiums_category: NONE
      spouse:
        age: 38
        employment_income: 10_000
        long_term_health_insurance_premiums: 500
      child:
        age: 5
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse, child]
        state_code: OH
  output:
    # Line 1 = 1,200 (head, no Medicare or employer plan); line 2 = 500
    # (spouse); line 8 = 6,000 - 3,750 = 2,250 (head).
    oh_uninsured_unreimbursed_medical_care_expenses: [1_200, 0, 0]
    oh_unreimbursed_medical_care_expense_deduction_person: [3_450, 500, 0]
    # Line 9 = 1,200 + 500 + 2,250.
    oh_unreimbursed_medical_care_expense_deduction: 3_950
    oh_agi: 46_050

- name: The head's medical deduction does not reduce the spouse's joint filing credit income
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        other_medical_expenses: 10_000
      spouse:
        age: 38
        employment_income: 2_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: OH
  output:
    # Line 5 = 10,000; line 7 = 62,000 * 0.075 = 4,650; line 8 = 5,350.
    oh_unreimbursed_medical_care_expense_deduction_person: [5_350, 0]
    oh_unreimbursed_medical_care_expense_deduction: 5_350
    oh_agi: 56_650
    # The spouse keeps 2,000 of qualifying income, above the 500 threshold.
    oh_joint_filing_credit_qualifying_income: [54_650, 2_000]
    oh_joint_filing_credit_eligible: true
    # Exemptions 2 * 2,150 = 4,300 (p. 17, MAGI 40,001-80,000), taxable 52,350,
    # tax 342 + 2.75% * (52,350 - 26,050) = 1,065.25 (2025 instructions, p. 18).
    # MAGI less exemptions is 52,350, so the credit is 10% = 106.53.
    oh_joint_filing_credit: 106.53

# PolicyBench reference audit 2026-10-05, scenario_025. R.C. 5747.01(A)(10)(b)
# deducts medical care, which includes insurance premiums under IRC 213(d)(1)(D)
# (R.C. 5747.01(A)(10)(c)), above 7.5% of federal AGI. The 2025 worksheet
# (p. 41) puts premiums paid while "eligible for Medicare or an employer-paid
# health care plan through your or your spouse's employer" on line 3. The head
# is 61, so not eligible for Medicare, but both spouses have employer coverage,
# so the head's $6,500 of after-tax premiums go on line 3 with $800 of other
# medical care. Over-the-counter medicine is not medical care (IRC 213(b)), and
# the $21,208 of employer-paid premiums were not paid by the taxpayer.
- name: Scenario 025, a non-Medicare filer's premiums count on line 3 through the spouse's employer plan
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 61
        has_esi: true
        employer_sponsored_insurance_premiums: 21_208
        health_insurance_premiums_without_medicare_part_b: 6_500
        # The prompt lists the same $6,500 again as "other health insurance
        # premiums", a component of the total; the Ohio path does not read it.
        other_health_insurance_premiums: 6_500
        other_medical_expenses: 800
        over_the_counter_health_expenses: 50
      spouse:
        age: 57
        has_esi: true
        employment_income: 62_725
        taxable_private_pension_income: 32_200
    tax_units:
      tax_unit:
        members: [head, spouse]
    marital_units:
      marital_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: OH
  output:
    adjusted_gross_income: 94_925
    # Line 1 is barred by the employer plan; line 3 = 6,500; line 4 = 800.
    oh_uninsured_unreimbursed_medical_care_expenses: [0, 0]
    oh_insured_unreimbursed_medical_care_expense_amount: [7_300, 0]
    # Line 7 = 94,925 * 7.5% = 7,119.375; line 8 = 7,300 - 7,119.375 = 180.625.
    oh_insured_unreimbursed_medical_care_expenses: 180.625
    oh_unreimbursed_medical_care_expense_deduction: 180.625
    oh_agi: 94_744.375
    # Less two $1,900 exemptions (MAGI above $80,000).
    oh_taxable_income: 90_944.375
    # R.C. 5747.02(A) for 2026: 332 + 2.75% * (90,944.375 - 26,050) =
    # 2,116.60, less the $200 retirement income credit (R.C. 5747.055(B)).
    oh_income_tax_before_refundable_credits: 1_916.60
