- name: dc_income_tax_before_credits_indiv uses optimal separate-combined deduction allocation
  absolute_error_margin: 0.01
  period: 2024
  input:
    people:
      person1:
        is_tax_unit_head: true
        dc_agi: 20_000
      person2:
        is_tax_unit_spouse: true
        dc_agi: 25_000
    tax_units:
      tax_unit:
        members: [person1, person2]
        tax_unit_itemizes: false
        dc_deduction_joint: 25_000
    spm_units:
      spm_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: DC
  output:
    dc_income_tax_before_credits_indiv: 800

- name: Filing separately on the same return gives up the D-2440 exclusion
  # Form D-2440 "Who may file": "If you are married or registered domestic
  # partners, you are filing a joint return". Separately on the same
  # return, the head's taxable income is 20,000 + 5,000 = 25,000:
  # 400 + 6% x 15,000 = 1,300; the spouse's 30,000: 400 + 6% x 20,000 =
  # 1,600.
  period: 2025
  input:
    people:
      head:
        is_tax_unit_head: true
        dc_taxable_income_indiv: 20_000
        dc_disability_exclusion: 5_000
      spouse:
        is_tax_unit_spouse: true
        dc_taxable_income_indiv: 30_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
    households:
      household:
        members: [head, spouse]
        state_code: DC
  output:
    dc_income_tax_before_credits_indiv: 2_900

- name: An unmarried filer keeps the D-2440 exclusion
  # 400 + 6% x 10,000 = 1,000 on 20,000.
  period: 2025
  input:
    people:
      head:
        is_tax_unit_head: true
        dc_taxable_income_indiv: 20_000
        dc_disability_exclusion: 5_000
    tax_units:
      tax_unit:
        members: [head]
        filing_status: SINGLE
    households:
      household:
        members: [head]
        state_code: DC
  output:
    dc_income_tax_before_credits_indiv: 1_000
