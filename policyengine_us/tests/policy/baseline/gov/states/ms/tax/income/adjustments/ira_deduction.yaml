# Mississippi Form 80-105 line 50 follows the deductible IRA amount.
- name: Mississippi deducts the allowed federal IRA amount
  period: 2026
  input:
    state_code: MS
    employment_income: 40_000
    traditional_ira_contributions_desired: 5_000
  output:
    traditional_ira_deduction: 5_000
    ms_agi_adjustments: 5_000

- name: Mississippi excludes nondeductible IRA contributions from adjustments
  period: 2026
  input:
    state_code: MS
    employment_income: 100_000
    ira_active_participant: true
    traditional_ira_contributions_desired: 5_000
  output:
    traditional_ira_contributions: 5_000
    traditional_ira_deduction: 0
    ms_agi_adjustments: 0

# ms_agi moves a dependent's income net of adjustments to the head, so the
# dependent's own deductible IRA contribution stays in the adjustments.
- name: Mississippi keeps a dependent's deductible IRA contribution
  period: 2026
  input:
    people:
      head:
        age: 40
        employment_income: 30_000
      dependent:
        age: 17
        is_tax_unit_dependent: true
        employment_income: 5_000
        traditional_ira_contributions_desired: 2_000
    tax_units:
      tax_unit:
        members: [head, dependent]
    households:
      household:
        members: [head, dependent]
        state_code: MS
  output:
    traditional_ira_contributions: [0, 2_000]
    # The parent cannot deduct the dependent's contribution federally.
    traditional_ira_deduction: [0, 0]
    traditional_ira_deductible_contributions: [0, 2_000]
    ms_agi_adjustments: [0, 2_000]
    # 30,000 + (5,000 - 2,000) moved from the dependent.
    ms_agi: [33_000, 0]
