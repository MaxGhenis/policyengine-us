- name: Default NY deduction.
  period: 2022
  absolute_error_margin: 0
  input:
    state_code: NY
    # Explicitly set sales taxes to 0 to test default behavior
    # without IRS sales tax table lookup values
    state_sales_tax: 0
    local_sales_tax: 0
  output:
    ny_standard_deduction: 8_000
    ny_itemized_deductions: 0
    ny_itemizes: false
    ny_deductions: 8_000

- name: A filer who subtracts an itemizable claim of right repayment takes the standard deduction.
  period: 2025
  absolute_error_margin: 0
  input:
    state_code: NY
    ny_claim_of_right_subtraction_bars_itemizing: true
    ny_standard_deduction: 8_000
    ny_itemized_deductions: 12_000
  output:
    ny_deductions: 8_000
