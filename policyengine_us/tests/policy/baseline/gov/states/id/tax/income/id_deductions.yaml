- name: Itemizes
  period: 2023
  input:
    id_itemized_deductions: 1_000
    standard_deduction: 500
    state_code: ID
  output:
    id_deductions: 1_000

- name: Does not itemize
  period: 2023
  input:
    id_itemized_deductions: 500
    standard_deduction: 1_000
    state_code: ID
  output:
    id_deductions: 1_000

- name: Standard deduction when itemizing would forfeit more premium subtraction
  period: 2026
  input:
    id_itemized_deductions: 20_200
    standard_deduction: 16_100
    id_health_insurance_premiums_itemized_portion: 5_500
    state_code: ID
  output:
    # Itemizing gains 20,200 - 16,100 = 4,100 of deductions but loses 5,500
    # of health insurance premiums subtraction (Form 39R worksheet line 8).
    id_deductions: 16_100

- name: Must itemize when married filing separately and the spouse itemizes
  period: 2026
  input:
    filing_status: SEPARATE
    separate_filer_itemizes: true
    id_itemized_deductions: 1_000
    standard_deduction: 2_000
    state_code: ID
  output:
    id_deductions: 1_000
