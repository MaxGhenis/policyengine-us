# Idaho Code 63-3022P allows a deduction for premiums the taxpayer paid for
# insurance that constitutes medical care for the taxpayer, spouse, or
# dependents, if not otherwise deducted or accounted for. Form 39R line 18
# health insurance worksheet: line 7 (total paid) minus line 9 (deducted
# elsewhere on the federal return).

- name: After-tax premiums paid by the taxpayer count in full.
  period: 2026
  input:
    state_code: ID
    health_insurance_premiums_without_medicare_part_b: 2_080
  output:
    id_eligible_health_insurance_premiums: 2_080

- name: Other health insurance premiums input is not added a second time.
  period: 2026
  input:
    state_code: ID
    health_insurance_premiums_without_medicare_part_b: 2_080
    # Feeds only the SPM premium aggregate, not statutory medical expenses.
    other_health_insurance_premiums: 2_080
  output:
    id_eligible_health_insurance_premiums: 2_080

- name: Employer-paid premiums are not paid by the taxpayer.
  period: 2026
  input:
    state_code: ID
    has_esi: true
    employer_sponsored_insurance_premiums: 6_309
  output:
    id_eligible_health_insurance_premiums: 0

- name: Pre-tax payroll premiums are excluded because they were never in income.
  period: 2026
  input:
    state_code: ID
    has_esi: true
    pre_tax_health_insurance_premiums: 3_000
  output:
    # Form 39R line 18: premiums paid through a cafeteria plan or other
    # salary-reduction arrangement don't qualify.
    id_eligible_health_insurance_premiums: 0

- name: Medicare Part B premiums count as health insurance premiums.
  period: 2026
  input:
    state_code: ID
    age: 70
    medicare_enrolled: true
    medicare_part_b_premium: 2_400
    health_insurance_premiums_without_medicare_part_b: 1_200
  output:
    # Form 39R line 18: premiums for voluntarily enrolled Medicare B or D
    # are deductible. 1,200 + 2,400 = 3,600
    id_eligible_health_insurance_premiums: 3_600

- name: Premiums for the spouse and dependents count.
  period: 2026
  input:
    people:
      head:
        age: 40
        health_insurance_premiums_without_medicare_part_b: 3_000
      spouse:
        age: 38
        health_insurance_premiums_without_medicare_part_b: 2_000
      child:
        age: 10
        health_insurance_premiums_without_medicare_part_b: 500
    tax_units:
      tax_unit:
        members: [head, spouse, child]
    households:
      household:
        members: [head, spouse, child]
        state_code: ID
  output:
    # 3,000 + 2,000 + 500 = 5,500
    id_eligible_health_insurance_premiums: 5_500

- name: Self-employed health insurance deduction is removed (worksheet line 9).
  period: 2026
  input:
    state_code: ID
    health_insurance_premiums: 8_000
    self_employed_health_insurance_ald: 3_000
  output:
    # 8,000 - 3,000 = 5,000
    id_eligible_health_insurance_premiums: 5_000

- name: Premiums fully deducted as self-employed health insurance leave nothing.
  period: 2026
  input:
    state_code: ID
    health_insurance_premiums: 8_000
    self_employed_health_insurance_ald: 8_000
  output:
    id_eligible_health_insurance_premiums: 0

- name: Not defined outside Idaho.
  period: 2026
  input:
    state_code: MT
    health_insurance_premiums_without_medicare_part_b: 2_080
  output:
    id_eligible_health_insurance_premiums: 0
