- name: Standard deduction plus full premium subtraction beats itemizing
  absolute_error_margin: 0.01
  period: 2026
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        health_insurance_premiums_without_medicare_part_b: 10_000
        charitable_cash_donations: 15_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: ID
  output:
    # Medical deduction 10,000 - 7.5% * 60,000 = 5,500; charity 15,000 less
    # the 0.5% of AGI floor = 14,700; Idaho itemized = 20,200.
    id_itemized_deductions: 20_200
    # The filer itemizes federally; the Idaho election is separate.
    tax_unit_itemizes: true
    id_health_insurance_premiums_itemized_portion: 5_500
    # Itemizing: 20,200 + (10,000 - 5,500) = 24,700 of reductions.
    # Standard: 16,100 + 10,000 = 26,100 of reductions.
    id_tax_unit_itemizes: false
    id_health_insurance_premiums_subtraction: 10_000
    id_deductions: 16_100
    # 60,000 - 10,000 - 16,100 = 33,900
    id_taxable_income: 33_900
    # (33,900 - 4,920) * 5.3% = 1,535.94; itemizing would give 1,610.14.
    id_income_tax_before_refundable_credits: 1_535.94

- name: Itemizing still wins after netting the premium loss
  absolute_error_margin: 0.01
  period: 2026
  input:
    people:
      head:
        age: 40
        employment_income: 60_000
        health_insurance_premiums_without_medicare_part_b: 10_000
        charitable_cash_donations: 25_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: ID
  output:
    # Idaho itemized = 5,500 medical + 24,700 charity = 30,200.
    # Itemizing: 30,200 + 4,500 = 34,700 > standard 16,100 + 10,000 = 26,100.
    id_tax_unit_itemizes: true
    # 10,000 - 5,500 deducted on Schedule A = 4,500
    id_health_insurance_premiums_subtraction: 4_500
    id_deductions: 30_200
    # 60,000 - 4,500 - 30,200 = 25,300
    id_taxable_income: 25_300
    # (25,300 - 4,920) * 5.3% = 1,080.14
    id_income_tax_before_refundable_credits: 1_080.14

- name: Subtraction applies before 2026
  absolute_error_margin: 0.01
  period: 2023
  input:
    people:
      head:
        age: 40
        employment_income: 40_000
        health_insurance_premiums_without_medicare_part_b: 3_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: ID
  output:
    id_health_insurance_premiums_subtraction: 3_000
    # 40,000 - 3,000 = 37,000
    id_agi: 37_000
    # 37,000 - 13,850 standard deduction = 23,150
    id_taxable_income: 23_150
    # 2023: (23,150 - 4,490) * 5.8% = 1,082.28
    id_income_tax_before_refundable_credits: 1_082.28

- name: Self-employed health insurance deduction is not subtracted again
  absolute_error_margin: 0.01
  period: 2026
  input:
    people:
      head:
        age: 40
        employment_income: 40_000
        is_self_employed: true
        self_employment_income: 3_000
        health_insurance_premiums: 8_000
    tax_units:
      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: ID
  output:
    # Deduction limited to 3,000 of self-employment earnings (IRC 162(l)(2)(A)).
    self_employed_health_insurance_ald: 3_000
    # 8,000 - 3,000 deducted in arriving at federal AGI = 5,000
    id_health_insurance_premiums_subtraction: 5_000

- name: Medicare Part B premiums are included
  absolute_error_margin: 0.01
