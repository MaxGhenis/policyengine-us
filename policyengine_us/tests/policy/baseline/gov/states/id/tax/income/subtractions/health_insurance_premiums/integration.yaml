# Idaho health insurance premiums subtraction (Idaho Code 63-3022P; Form 39R
# line 18) through Idaho tax. Idaho's 2026 rate is 5.3% above a zero-rate
# bracket of $4,920 for single filers (2025's $4,811 uprated).

- name: PolicyBench scenario_007, single retiree with after-tax premiums
  absolute_error_margin: 0.01
  period: 2026
  input:
    people:
      head:
        age: 56
        bank_account_assets: 71_500
        employer_sponsored_insurance_premiums: 6_309.28
        has_esi: true
        health_insurance_premiums_without_medicare_part_b: 2_080
        hours_worked_last_week: 50
        other_health_insurance_premiums: 2_080
        other_medical_expenses: 150
        pre_subsidy_rent: 18_352.94
        social_security_disability: 19_285
        tax_exempt_private_pension_income: 284.12
        taxable_private_pension_income: 35_280
    tax_units:
      tax_unit:
        members: [head]
    spm_units:
      spm_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: ID
        household_vehicles_value: 2_660
  output:
    # Taxable Social Security: 0.85 * (35,280 + 0.5 * 19,285 - 34,000)
    # + 4,500 = 13,784.13. Federal AGI = 35,280 + 13,784.13 = 49,064.13.
    adjusted_gross_income: 49_064.13
    # The $2,080 premium is one after-tax payment; the employer-paid
    # $6,309.28 does not count.
    id_health_insurance_premiums_subtraction: 2_080
    # Medical expenses 2,230 are below 7.5% of AGI, so no itemizing.
    id_tax_unit_itemizes: false
    # 49,064.13 - 13,784.13 taxable Social Security - 2,080 = 33,200
    id_agi: 33_200
    # 33,200 - 16,100 standard deduction = 17,100
    id_taxable_income: 17_100
    # (17,100 - 4,920) * 5.3% = 645.54; was 755.78 without the subtraction.
    id_income_tax_before_refundable_credits: 645.54

- name: PolicyBench scenario_053, single worker with after-tax premiums
  absolute_error_margin: 0.01
  period: 2026
  input:
    people:
      head:
        age: 25
        employment_income: 66_968.68
        bank_account_assets: 3_660
        employer_sponsored_insurance_premiums: 3_389.28
        has_esi: true
        health_insurance_premiums_without_medicare_part_b: 5_000
        hourly_wage: 32
        hours_worked_last_week: 40
        is_paid_hourly: true
        other_health_insurance_premiums: 5_000
        other_medical_expenses: 400
        over_the_counter_health_expenses: 150
        pre_subsidy_rent: 37_200
    tax_units:
      tax_unit:
        members: [head]
    spm_units:
      spm_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: ID
        auto_loan_balance: 19_000
        auto_loan_interest: 950
        household_vehicles_value: 7_410
  output:
    id_health_insurance_premiums_subtraction: 5_000
    # Itemized 377.35 (medical 5,400 - 7.5% * 66,968.68) is all premiums, so
    # itemizing nets zero against the 16,100 standard deduction.
    id_health_insurance_premiums_itemized_portion: 377.35
    id_tax_unit_itemizes: false
    # 66,968.68 - 5,000 = 61,968.68
    id_agi: 61_968.68
    # 61,968.68 - 16,100 = 45,868.68
    id_taxable_income: 45_868.68
    # (45,868.68 - 4,920) * 5.3% = 2,170.28; was 2,435.28 without the subtraction.
    id_income_tax_before_refundable_credits: 2_170.28

