      tax_unit:
        members: [head]
    households:
      household:
        members: [head]
        state_code: ID
  output:
    # 1,200 + 2,400 = 3,600
    id_health_insurance_premiums_subtraction: 3_600
    # 40,000 - 3,600 = 36,400
    id_agi: 36_400
