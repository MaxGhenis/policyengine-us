# Idaho Code 63-3022P; Form 39R line 18 health insurance worksheet line 10 =
# line 7 - line 8 - line 9. Filers who take the Idaho standard deduction
# enter zero on line 8.

- name: Standard deduction filers keep the full premium subtraction.
  period: 2026
  input:
    state_code: ID
    id_eligible_health_insurance_premiums: 10_000
    id_health_insurance_premiums_itemized_portion: 5_500
    id_tax_unit_itemizes: false
  output:
    id_health_insurance_premiums_subtraction: 10_000

- name: Itemizers lose the premiums already deducted on Schedule A.
  period: 2026
  input:
    state_code: ID
    id_eligible_health_insurance_premiums: 10_000
    id_health_insurance_premiums_itemized_portion: 5_500
    id_tax_unit_itemizes: true
  output:
    # 10,000 - 5,500 = 4,500
    id_health_insurance_premiums_subtraction: 4_500

- name: Itemizers whose premiums are fully deducted on Schedule A.
  period: 2026
  input:
    state_code: ID
    id_eligible_health_insurance_premiums: 10_000
    id_health_insurance_premiums_itemized_portion: 10_000
    id_tax_unit_itemizes: true
  output:
    id_health_insurance_premiums_subtraction: 0

- name: No premiums, no subtraction.
  period: 2026
  input:
    state_code: ID
    id_eligible_health_insurance_premiums: 0
    id_health_insurance_premiums_itemized_portion: 0
    id_tax_unit_itemizes: false
  output:
    id_health_insurance_premiums_subtraction: 0
