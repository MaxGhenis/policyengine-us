- name: Alabama AGI includes modeled federal deductions the state still allows
  period: 2025
  input:
    state_code: AL
    irs_employment_income: 1_000
    early_withdrawal_penalty: 50
    health_savings_account_ald: 150
    self_employed_pension_contribution_ald: 100
  output:
    al_agi: 700

- name: SSTB self-employment income is included in Alabama AGI
  period: 2024
  input:
    sstb_self_employment_income: 100_000
    state_code: AL
  output:
    al_agi: 100_000

- name: Taxable Roth conversions are included in Alabama AGI and income tax
  period: 2026
  input:
    people:
      person1:
        age: 40
        employment_income: 50_000
        taxable_roth_conversions: 10_000
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
        filing_status: SINGLE
    spm_units:
      spm_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: AL
  output:
    al_agi: 60_000
    al_income_tax: 2_442.75

- name: A dependent's self-employment income and deductions stay off the filer's Alabama AGI
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      parent:
        age: 40
        employment_income: 40_000
      child:
        age: 17
        self_employment_income: 10_000
        self_employed_health_insurance_premiums: 1_000
        self_employed_pension_contributions: 500
    tax_units:
      tax_unit:
        members: [parent, child]
    households:
      household:
        members: [parent, child]
        state_code: AL
  output:
    # A dependent who meets the filing requirement files their own Alabama
    # return (2025 Form 40 Booklet, page 5), so the child's 10,000 of Schedule
    # C income and their own self-employed health insurance (1,000) and SEP
    # (500) deductions are all on the child's return, as federally. Alabama
    # AGI is the parent's 40,000 of wages.
    adjusted_gross_income: 40_000
    al_agi: 40_000
