# 7 CFR 273.10(e)(2)(iii): a state denies, or certifies and suspends, an
# eligible household of three or more entitled to no benefits. California
# denies (CDSS ACIN I-50-13; ACL 14-63). FY2026 contiguous-US maximum
# allotment for three people is $785 (CDSS ACIN I-46-25).
- name: California unit of three whose allotment computes to exactly zero is denied.
  period: 2026-01
  input:
    people:
      person:
        age: 30
    spm_units:
      spm_unit:
        members: [person]
        snap_unit_size: 3
        snap_max_allotment: 785
        snap_expected_contribution: 785
        snap_min_allotment: 0
    households:
      household:
        members: [person]
        state_code: CA
  output:
    snap_zero_benefit_denial_applies: true

