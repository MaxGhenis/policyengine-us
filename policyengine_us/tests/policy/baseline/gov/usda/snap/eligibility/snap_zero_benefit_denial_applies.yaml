# Full California households in FY2026, using CDSS ACIN I-46-25,
# attachment I: maximum allotment for three people $785; standard deduction
# $209 (1-3 people); net standard (100% of poverty) $2,221 and MCE gross
# standard (200%) $4,442 for three; 20% earned income deduction. No housing
# costs, so the excess shelter deduction is zero at these incomes whichever
# utility allowance applies.
- name: California MCE household of three whose allotment computes to zero is denied.
  period: 2026-01
  absolute_error_margin: 0.1
  input:
    people:
      parent:
        age: 35
        employment_income: 48_000
        weekly_hours_worked_before_lsr: 40
      child1:
        age: 8
      child2:
        age: 4
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
        housing_cost: 0
    tax_units:
      tax_unit:
        members: [parent, child1, child2]
    households:
      household:
        members: [parent, child1, child2]
        state_code: CA
  output:
    # Gross $4,000 is within the $4,442 MCE standard. Net $4,000 - $800 -
    # $209 = $2,991; 30% = $897.30, rounded up to $898, above the $785
    # maximum. California denies the application because net income
    # "exceeds the level at which benefits are issued" (ACL 14-63).
    snap_net_income: 2_991
    snap_expected_contribution: 898
    snap_zero_benefit_denial_applies: true
    is_snap_eligible: false
    snap: 0

# The next two cases set the BBCE net income test as met. CalFresh MCE has
# no net income test (CDSS ACL 12-62, 13-32, 14-56), so the household is
# categorically eligible above the $2,221 net standard and reaches the
# issuance-table boundary this rule turns on.
- name: California MCE household of three one dollar above the zero boundary is eligible for $1.
  period: 2026-01
  absolute_error_margin: 0.1
  input:
    people:
      parent:
        age: 35
        employment_income: 42_300
        weekly_hours_worked_before_lsr: 40
      child1:
        age: 8
      child2:
        age: 4
    spm_units:
      spm_unit:
        members: [parent, child1, child2]
        housing_cost: 0
        meets_tanf_non_cash_net_income_test: true
    tax_units:
      tax_unit:
        members: [parent, child1, child2]
    households:
      household:
        members: [parent, child1, child2]
        state_code: CA
  output:
    meets_snap_categorical_eligibility: true
    # Net $3,525 - $705 - $209 = $2,611; 30% = $783.30, rounded up to $784.
    snap_net_income: 2_611
    snap_expected_contribution: 784
    snap_zero_benefit_denial_applies: false
    is_snap_eligible: true
    snap: 1

