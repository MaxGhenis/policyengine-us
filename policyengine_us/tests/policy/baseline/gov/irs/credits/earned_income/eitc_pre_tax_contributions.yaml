# IRC 32(c)(2)(A)(i): wages count only if includible in gross income.
# https://www.law.cornell.edu/uscode/text/26/32#c_2_A_i
# EGTRRA section 303(b), (i) applies this rule after 2001, not just in 2026.
- name: Traditional 401k deferrals reduce EITC earnings before 2026
  period: 2024
  input:
    employment_income: 10_000
    traditional_401k_contributions_desired: 2_000
  output:
    irs_employment_income: 8_000
    eitc_earned_income: 8_000

- name: Roth 401k contributions remain in EITC earnings
  period: 2026
  input:
    employment_income: 10_000
    roth_401k_contributions_desired: 2_000
  output:
    eitc_earned_income: 10_000

- name: Traditional 403b deferrals reduce EITC earnings
  period: 2025
  input:
    employment_income: 10_000
    traditional_403b_contributions_desired: 2_000
  output:
    eitc_earned_income: 8_000

- name: Payroll HSA contributions and pre-tax health premiums reduce EITC earnings
  period: 2026
  input:
    employment_income: 10_000
    health_savings_account_payroll_contributions: 1_000
    pre_tax_health_insurance_premiums: 500
  output:
    eitc_earned_income: 8_500

- name: IRA contributions do not reduce EITC earnings
  period: 2026
  input:
    employment_income: 10_000
    traditional_ira_contributions: 2_000
  output:
    eitc_earned_income: 10_000

- name: Deferrals preserve netting of spouses self-employment losses
  period: 2026
  input:
    people:
      head:
        employment_income: 10_000
        traditional_401k_contributions_desired: 2_000
      spouse:
        self_employment_income: -9_000
    tax_units:
      tax_unit:
        members: [head, spouse]
  output:
    eitc_earned_income: 0

- name: Dependent wages and deferrals do not enter filers EITC earnings
  period: 2026
  input:
    people:
      head:
        age: 40
        employment_income: 10_000
        traditional_401k_contributions_desired: 2_000
      child:
        age: 16
        employment_income: 5_000
        traditional_401k_contributions_desired: 1_000
        is_tax_unit_dependent: true
    tax_units:
      tax_unit:
        members: [head, child]
  output:
    eitc_earned_income: 8_000

# Provision-level PolicyBench snapshots use the audit's taxable wage/AGI
# amounts explicitly; the rendered household prompts round gross wages and
# desired deferrals to whole dollars. These are not raw scenario JSON fixtures.
# IRC 24(d)(1)(B)(i) uses section 32 earnings for the ACTC phase-in.
- name: PolicyBench scenario 100 taxable earnings eliminate ACTC and reduce MT EITC
  period: 2026
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 46
        employment_income: 5_915
        irs_employment_income: 2_055.72
      child1:
        age: 6
      child2:
        age: 5
    tax_units:
      tax_unit:
        members: [head, child1, child2]
    households:
      household:
        members: [head, child1, child2]
        state_code: MT
  output:
    eitc_earned_income: 2_055.72
    # 0.4 * 2,055.72; earnings are below the $2,500 ACTC threshold.
    eitc: 822.29
    refundable_ctc: 0
    income_tax_refundable_credits: 822.29
    # MCA 15-30-2318: 20% of federal EITC in 2026.
    mt_eitc: [164.46, 0, 0]

- name: PolicyBench scenario 119 phases out on AGI after wage deferrals
  period: 2026
  absolute_error_margin: 0.01
  input:
    age: 45
    state_code: VA
    employment_income: 55_000
    traditional_401k_contributions_desired: 3_087
    adjusted_gross_income: 52_568.54
    eitc_child_count: 2
    filing_status: HEAD_OF_HOUSEHOLD
    # Pin the audit's unchanged ACTC to isolate the EITC provision.
    refundable_ctc: 2_089.77
    # Va. Code 58.1-339.8(B)(2): explicitly elect the nonrefundable credit.
    va_claims_refundable_eitc: false
    va_income_tax_before_non_refundable_credits: 2_011.94
  output:
    # 7,316 - 0.2106 * (52,568.54 - 23,890).
    eitc: 1_276.30
    income_tax_refundable_credits: 3_366.07
    va_non_refundable_eitc: 255.26
    va_income_tax_before_refundable_credits: 1_756.68
