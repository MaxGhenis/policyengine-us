# Which Optional Local Sales Tax Table Should I Use? (Instructions for
# Schedule A (Form 1040)). Each state defaults to the table in its row for
# any (other) locality that imposes a local sales tax, quoted below by
# state. Mississippi has no such row; PolicyEngine uses its "City of
# Jackson only" row.

- name: Default local tables, 2022
  # 2022 selector (PDF page 17), row and table by state:
  # AK: "... or any locality that imposes a local sales tax" -> C
  # AR: "Any Locality that imposes a local sales tax" -> C
  # AZ: "... or any other locality that imposes a local sales tax" -> B
  # CO: "... or any other locality that imposes a local sales tax" -> A
  # GA: "Any other locality that imposes a local sales tax" -> C
  # IL: "... or any other locality that imposes a local sales tax" -> A
  # LA: "... or any other locality that imposes a local sales tax" -> C
  # MO: "Any locality that imposes a local sales tax" -> C
  # MS: "City of Jackson only" -> A
  # NC: "Any locality that imposes a local sales tax" -> B
  # NY: "Any other locality that imposes a local sales tax" -> D
  # SC: "... or any other locality that imposes a local sales tax" -> C
  # TN: "Any locality that imposes a local sales tax" -> C
  # UT: "Any locality that imposes a local sales tax" -> A
  # VA: "Any locality that imposes a local sales tax" -> C
  period: 2022
  input:
    people:
      person_AK:
        age: 40
      person_AR:
        age: 40
      person_AZ:
        age: 40
      person_CO:
        age: 40
      person_GA:
        age: 40
      person_IL:
        age: 40
      person_LA:
        age: 40
      person_MO:
        age: 40
      person_MS:
        age: 40
      person_NC:
        age: 40
