# State and Local General Sales Tax Deduction Worksheet, Instructions for
# Schedule A (Form 1040), 2022-2025:
# - Line 2, for the local-table states: "Enter your base local general sales
#   taxes from the [year] Optional Local Sales Tax Tables."
# - Line 3: "Enter your local general sales tax rate, but omit the percentage
#   sign. For example, if your local general sales tax rate was 2.5%, enter
#   2.5."
# - Line 4, if line 2 is 0: "Enter your state general sales tax rate (shown in
#   the table heading for your state)".
# - Line 5: "Divide line 3 by line 4."
# - Line 6: if line 2 is not 0, "Multiply line 2 by line 3"; otherwise
#   "Multiply line 1 by line 5."
# Line 3 is the combined rate minus the heading rate, in percentage points.
# Local table cells are quoted as the printed row for the family-size columns
# 1 2 3 4 5 "Over 5".

# Local-table states, default table (Which Optional Local Sales Tax Table
# Should I Use?). Line 6 = local table cell x line 3.

