# Worksheet end to end for a household: income picks the row, the tax unit
# size picks the column, and line 8 adds the state and local amounts.

- name: Tennessee couple 2024, state table plus Local Table B
  # Income $50,000 + $35,000 = $85,000, family size 2.
  # 2024 Tennessee state table (p15, heading 7.00%), $80,000-$90,000:
  #   1108 1317 1461 1574 1669 1804 -> line 1 = 1,317.
  # 2024 Local Table B (p17), $80,000-$90,000: 140 167 186 201 213 231
  #   -> line 2 = 167.
  # Line 3 = 9.75 - 7.0 = 2.75; line 6 = 167 x 2.75 = 459.25.
  # Tennessee levies no income tax, so the sales tax amount is
  # 1,317 + 459.25 = 1,776.25.
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      head:
        age: 40
        employment_income: 50_000
      spouse:
        age: 40
        employment_income: 35_000
    tax_units:
      tax_unit:
        members: [head, spouse]
    households:
      household:
        members: [head, spouse]
        state_code: TN
        combined_sales_tax_rate: 0.0975
  output:
    state_sales_tax_income_bracket: 8
    state_sales_tax: 1_317
    local_sales_tax: 459.25
    state_and_local_sales_or_income_tax: 1_776.25
