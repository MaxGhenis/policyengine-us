# Schedule D Tax Worksheet line 46 and Qualified Dividends and Capital Gain
# Tax Worksheet line 24 (2025): the tax on all taxable income at the regular
# rates, the 26 U.S.C. 1(h)(1) limit on the regular tax. For a Form 2555
# filer, the tax on line 3 of the Foreign Earned Income Tax Worksheet less
# the tax on the excluded amount (lines 4 to 6). Single amounts from the 2025
# Tax Computation Worksheet: 12% of an amount between $11,925 and $48,475
# less $238.50.

- name: The tax on all taxable income, gains included
  period: 2025
  absolute_error_margin: 0.01
  input:
    filing_status: SINGLE
    taxable_income: 48_475
    net_capital_gain: 125
    adjusted_net_capital_gain: 125
    foreign_earned_income_exclusion: 0
  output:
    # 12% of 48,475 less 238.50.
    income_tax_main_rates_on_taxable_income: 5_578.50

- name: Stacked on the excluded amount
  period: 2025
  absolute_error_margin: 0.01
  input:
    filing_status: SINGLE
    taxable_income: 18_475
    net_capital_gain: 125
    adjusted_net_capital_gain: 125
    foreign_earned_income_exclusion: 30_000
  output:
    # Line 3 = 48,475 (tax 5,578.50) less the tax on 30,000 (3,361.50).
    income_tax_main_rates_on_taxable_income: 2_217

- name: No taxable income
  period: 2025
  input:
    filing_status: SINGLE
    taxable_income: 0
    net_capital_gain: 10_000
    foreign_earned_income_exclusion: 0
  output:
    income_tax_main_rates_on_taxable_income: 0
