# IRC 219(g)(2) applies the phase-out to the annual dollar limit, rounds
# the reduction down to $10, and retains a $200 limit until the endpoint.
# Notice 2025-67 sets the 2026 single range at $81,000-$91,000.
- name: No reduction at the single phase-out start
  period: 2026
  input:
    age: 49
    ira_active_participant: true
    traditional_ira_deduction_magi: 81_000
  output:
    traditional_ira_deductible_limit: 7_500

- name: Round the reduction down to ten dollars
  period: 2026
  input:
    age: 49
    ira_active_participant: true
    traditional_ira_deduction_magi: 86_001
  output:
    # $7,500 - floor($7,500 * 5,001 / 10,000 / $10) * $10.
    traditional_ira_deductible_limit: 3_750

- name: Preserve the two hundred dollar floor before complete phase-out
  period: 2026
  input:
    age: 49
    ira_active_participant: true
    traditional_ira_deduction_magi: 90_999
  output:
    traditional_ira_deductible_limit: 200

- name: The floor does not create a deduction exceeding contributions
  period: 2026
  input:
    age: 49
    ira_active_participant: true
    traditional_ira_deduction_magi: 90_999
    ira_compensation: 100_000
    traditional_ira_contributions_desired: 80
  output:
    traditional_ira_contributions: 80
    traditional_ira_deduction: 80

- name: Zero deduction at the phase-out endpoint
  period: 2026
  input:
    age: 49
    ira_active_participant: true
    traditional_ira_deduction_magi: 91_000
  output:
    traditional_ira_deductible_limit: 0

- name: Catch-up amount is subject to the same proportional phase-out
  period: 2026
  input:
    age: 50
    ira_active_participant: true
    traditional_ira_deduction_magi: 86_001
  output:
    traditional_ira_deductible_limit: 4_300

- name: No workplace plan coverage means no income phase-out
  period: 2026
  input:
    age: 49
    employment_income: 500_000
    traditional_ira_contributions_desired: 7_500
  output:
    ira_active_participant: false
    traditional_ira_deduction: 7_500

- name: Joint active participant phase-out spans twenty thousand dollars
  period: 2026
  input:
    age: 49
    filing_status: JOINT
    ira_active_participant: true
    traditional_ira_deduction_magi: 139_000
  output:
    traditional_ira_deductible_limit: 3_750

- name: Qualifying surviving spouse uses the joint phase-out range
  period: 2026
  input:
    age: 49
    filing_status: SURVIVING_SPOUSE
    ira_active_participant: true
    traditional_ira_deduction_magi: 139_000
  output:
    traditional_ira_deductible_limit: 3_750

- name: Head of household uses the single phase-out range
  period: 2026
  input:
    age: 49
    filing_status: HEAD_OF_HOUSEHOLD
    ira_active_participant: true
    traditional_ira_deduction_magi: 86_001
  output:
    traditional_ira_deductible_limit: 3_750

# IRC 219(g)(7) uses a separate $242,000-$252,000 range for an uncovered
# joint filer whose spouse participates, but keeps the covered spouse's range.
- name: Only the uncovered spouse uses the spouse-only coverage range
  period: 2026
  input:
    people:
      head:
        age: 49
        ira_active_participant: true
        ira_compensation: 200_000
        traditional_ira_contributions_desired: 7_500
      spouse:
        age: 49
        ira_active_participant: false
        ira_compensation: 47_000
        traditional_ira_contributions_desired: 7_500
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
        traditional_ira_deduction_magi: 247_000
  output:
    traditional_ira_contributions: [7_500, 7_500]
    traditional_ira_deductible_limit: [0, 3_750]
    traditional_ira_deduction: [0, 3_750]

# IRC 219(g)(4) disregards marriage when separate filers lived apart all year.
- name: Separate filer living apart all year uses the single range
  period: 2026
  input:
    age: 49
    filing_status: SEPARATE
    cohabitating_spouses: false
    ira_active_participant: true
    traditional_ira_deduction_magi: 85_000
  output:
    traditional_ira_deductible_limit: 4_500

- name: Separate filer living with spouse uses the zero to ten thousand range
  period: 2026
  input:
    age: 49
    filing_status: SEPARATE
    cohabitating_spouses: true
    ira_active_participant: true
    traditional_ira_deduction_magi: 85_000
  output:
    traditional_ira_deductible_limit: 0

- name: Separate filer is affected by a cohabiting covered spouse on another return
  period: 2026
  input:
    people:
      head:
        age: 49
        ira_active_participant: false
      spouse:
        age: 49
        ira_active_participant: true
    marital_units:
      couple:
        members: [head, spouse]
    tax_units:
      first_return:
        members: [head]
        filing_status: SEPARATE
        cohabitating_spouses: true
        traditional_ira_deduction_magi: 5_000
      second_return:
        members: [spouse]
        filing_status: SEPARATE
        cohabitating_spouses: true
        traditional_ira_deduction_magi: 5_000
  output:
    traditional_ira_deductible_limit: [3_750, 3_750]

- name: Separate filer living apart ignores the other spouse's coverage
  period: 2026
  input:
    people:
      head:
        age: 49
        ira_active_participant: false
      spouse:
        age: 49
        ira_active_participant: true
    marital_units:
      couple:
        members: [head, spouse]
    tax_units:
      first_return:
        members: [head]
        filing_status: SEPARATE
        cohabitating_spouses: false
        traditional_ira_deduction_magi: 300_000
      second_return:
        members: [spouse]
        filing_status: SEPARATE
        cohabitating_spouses: false
        traditional_ira_deduction_magi: 85_000
  output:
    traditional_ira_deductible_limit: [7_500, 4_500]

- name: A covered dependent does not phase out the parents' deductions
  period: 2026
  input:
    people:
      head:
        age: 49
        ira_active_participant: false
      spouse:
        age: 49
        ira_active_participant: false
      dependent:
        age: 20
        is_tax_unit_dependent: true
        ira_active_participant: true
    tax_units:
      tax_unit:
        members: [head, spouse, dependent]
        filing_status: JOINT
        traditional_ira_deduction_magi: 300_000
  output:
    # The dependent's own limit uses their own (zero) income and the single
    # range, not the parents' joint MAGI.
    traditional_ira_deductible_limit: [7_500, 7_500, 7_500]

# Historical thresholds from IRS Publication 590 (2010) and Notices
# 2024-80 and 2025-67; IRC 219(g) is not limited to the audit year.
- name: Single phase-out in 2010
  period: 2010
  input:
    age: 49
    filing_status: SINGLE
    ira_active_participant: true
    traditional_ira_deduction_magi: 61_000
  output:
    traditional_ira_deductible_limit: 2_500

- name: Single phase-out in 2024
  period: 2024
  input:
    age: 49
    ira_active_participant: true
    traditional_ira_deduction_magi: 82_000
  output:
    traditional_ira_deductible_limit: 3_500

- name: Single phase-out in 2025
  period: 2025
  input:
    age: 49
    ira_active_participant: true
    traditional_ira_deduction_magi: 84_000
  output:
    traditional_ira_deductible_limit: 3_500

# A dependent files their own return: section 219(g) applies to their own
# income with the single range, while the parents cannot deduct the amount.
- name: A covered dependent's limit uses their own income
  period: 2026
  input:
    people:
      head:
        age: 49
        employment_income: 150_000
        traditional_401k_contributions_desired: 10_000
      spouse:
        age: 49
        employment_income: 150_000
      dependent:
        age: 20
        is_tax_unit_dependent: true
        employment_income: 20_000
        traditional_401k_contributions_desired: 1_000
        traditional_ira_contributions_desired: 3_000
    tax_units:
      tax_unit:
        members: [head, spouse, dependent]
        filing_status: JOINT
  output:
    ira_active_participant: [true, false, true]
    traditional_ira_deduction_gross_income: [140_000, 150_000, 19_000]
    traditional_ira_dependent_magi: [0, 0, 19_000]
    traditional_ira_deduction_magi: 290_000
    # Both parents are phased out; the dependent's 19,000 is below 81,000.
    traditional_ira_deductible_limit: [0, 0, 7_500]
    traditional_ira_deductible_contributions: [0, 0, 3_000]
    traditional_ira_deduction: [0, 0, 0]

- name: A covered dependent with income in the single range is phased out
  period: 2026
  input:
    people:
      head:
        age: 49
      dependent:
        age: 22
        is_tax_unit_dependent: true
        employment_income: 91_001
        traditional_401k_contributions_desired: 5_000
    tax_units:
      tax_unit:
        members: [head, dependent]
  output:
    traditional_ira_dependent_magi: [0, 86_001]
    # 86,001 is 5,001 into the single range: 7,500 - 3,750 = 3,750.
    traditional_ira_deductible_limit: [7_500, 3_750]

# Former IRC 219(d)(1) barred the deduction for an individual who attained
# age 70 1/2 before the close of the taxable year. With no deduction allowed,
# the former 408(o)(2)(B)(i) nondeductible limit was also zero, so no
# traditional contribution was allowed. Pub. L. 116-94, div. O, section 107
# repealed the bar for contributions for taxable years after 2019. Roth IRA
# contributions disregard it under 408A(c)(2) and (c)(4).
- name: Age 70 1/2 bars traditional IRA contributions and the deduction in 2019
  period: 2019
  input:
    age: 72
    employment_income: 50_000
    traditional_ira_contributions_desired: 3_000
    roth_ira_contributions_desired: 2_000
  output:
    traditional_ira_age_barred: true
    traditional_ira_contributions: 0
    roth_ira_contributions: 2_000
    traditional_ira_deductible_limit: 0
    traditional_ira_deduction: 0
    adjusted_gross_income: 50_000

- name: Roth requests use the full limit when traditional contributions are barred
  period: 2019
  input:
    age: 72
    employment_income: 50_000
    traditional_ira_contributions_desired: 5_000
    roth_ira_contributions_desired: 8_000
  output:
    # 2019 limit: $6,000 plus the $1,000 catch-up. Only the $8,000 Roth
    # request shares it, so the scale is 7,000 / 8,000.
    ira_contribution_limit: 7_000
    ira_contribution_scale: 0.875
    traditional_ira_contributions: 0
    roth_ira_contributions: 7_000

- name: A barred spouse's traditional request does not reduce the spousal limit
  period: 2019
  input:
    people:
      head:
        age: 72
        employment_income: 10_000
        traditional_ira_contributions_desired: 7_000
      spouse:
        age: 60
        traditional_ira_contributions_desired: 7_000
    tax_units:
      tax_unit:
        members: [head, spouse]
        filing_status: JOINT
  output:
    traditional_ira_age_barred: [true, false]
    # IRC 219(c)(1)(B)(ii) reduces the spouse's compensation only by the
    # head's allowed deduction, nondeductible, and Roth contributions: zero.
    ira_contribution_limit: [7_000, 7_000]
    traditional_ira_contributions: [0, 7_000]
    traditional_ira_deduction: [0, 7_000]

- name: A fractional age at or above 70.5 bars the deduction in 2018
  period: 2018
  input:
    age: 70.5
    employment_income: 50_000
    traditional_ira_contributions_desired: 3_000
  output:
    traditional_ira_age_barred: true
    traditional_ira_contributions: 0
    traditional_ira_deductible_limit: 0
    traditional_ira_deduction: 0

- name: An integer age of 70 is treated as not yet 70 1/2
  period: 2019
  input:
    age: 70
    employment_income: 50_000
    traditional_ira_contributions_desired: 3_000
  output:
    traditional_ira_age_barred: false
    traditional_ira_contributions: 3_000
    traditional_ira_deductible_limit: 7_000
    traditional_ira_deduction: 3_000

- name: The age bar no longer applies from 2020
  period: 2020
  input:
    age: 72
    employment_income: 50_000
    traditional_ira_contributions_desired: 3_000
    roth_ira_contributions_desired: 2_000
  output:
    traditional_ira_age_barred: false
    traditional_ira_contributions: 3_000
    roth_ira_contributions: 2_000
    traditional_ira_deductible_limit: 7_000
    traditional_ira_deduction: 3_000
    adjusted_gross_income: 47_000

- name: The age bar applies with the historical thresholds in 2010
  period: 2010
  input:
    age: 71
    filing_status: SINGLE
    ira_active_participant: false
    traditional_ira_deduction_magi: 40_000
  output:
    traditional_ira_age_barred: true
    traditional_ira_deductible_limit: 0
