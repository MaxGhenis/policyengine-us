# IRC 219(b)(1)(B), 219(f)(1), and 401(c)(2); Publication 590-A,
# "What Is Compensation?" Net self-employment losses do not offset wages.
- name: IRA compensation excludes investment income and retirement distributions.
  period: 2026
  input:
    age: 64
    social_security_retirement: 59_510
    taxable_ira_distributions: 94_720
    taxable_private_pension_income: 32_525
    taxable_interest_income: 2_740
    qualified_dividend_income: 3_760
    short_term_capital_gains: 1_080
    long_term_capital_gains: -2_662
  output:
    ira_compensation: 0
    ira_contribution_limit: 0

- name: Net self-employment losses cannot reduce IRA compensation from wages.
  period: 2026
  input:
    employment_income: 600
    self_employment_income: -1_000
    traditional_ira_contributions_desired: 1_000
  output:
    ira_compensation: 600
    ira_contribution_limit: 600
    traditional_ira_contributions: 600
    traditional_ira_deduction: 600

- name: All earned business income is reduced by pension and half SE tax deductions.
  period: 2026
  input:
    irs_employment_income: 1_000
    self_employment_income: 2_000
    sstb_self_employment_income: 3_000
    farm_operations_income: 4_000
    partnership_self_employment_net_earnings: 5_000
    self_employment_tax_ald_person: 1_000
    self_employed_pension_contribution_ald_person: 2_000
  output:
    # 1,000 + (2,000 + 3,000 + 4,000 + 5,000 - 1,000 - 2,000).
    ira_compensation: 12_000

- name: Traditional payroll deferrals reduce IRA compensation.
  period: 2026
  input:
    employment_income: 3_000
    traditional_401k_contributions_desired: 2_500
    traditional_ira_contributions_desired: 1_000
  output:
    ira_compensation: 500
    traditional_ira_contributions: 500
    traditional_ira_deduction: 500

# Pub. 590-A includes taxable alimony from pre-2019 divorce instruments.
- name: Taxable alimony supports an IRA contribution without wages.
  period: 2026
  input:
    alimony_income: 600
    divorce_year: 2018
    traditional_ira_contributions_desired: 1_000
  output:
    ira_compensation: 600
    traditional_ira_contributions: 600

- name: Nontaxable alimony is not IRA compensation.
  period: 2026
  input:
    alimony_income: 600
    divorce_year: 2019
    traditional_ira_contributions_desired: 1_000
  output:
    ira_compensation: 0
    traditional_ira_contributions: 0
