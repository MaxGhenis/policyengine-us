- name: Household state income tax subtracts refundable credits
  period: 2021
  input:
    co_income_tax_before_refundable_credits: 3_000
    ne_income_tax_before_refundable_credits: 2_000
    pa_income_tax_before_refundable_credits: 100
    hi_refundable_credits: 300
    ok_refundable_credits: 500
    ut_refundable_credits: 400
  output:
    household_state_income_tax: 3_900

- name: Wisconsin household state income tax follows the claimed retirement subtraction
  # Wis. Stat. 71.05(6)(b)54m.d: a return that claims Schedule SB line 16
  # claims no credits, so the household total is the 3000 line 16 tax.
  period: 2025
  input:
    state_code: WI
    age: 67
    taxable_ira_distributions: 24_000
    wi_income_tax_before_credits: 5_000
    wi_property_tax_credit_potential: 500
    wi_retirement_income_exclusion_tax: 3_000
    wi_earned_income_credit_potential: 0
    wi_homestead_eligible: true
    wi_homestead_credit_potential: 200
  output:
    household_state_income_tax: 3_000

- name: Case 3, New Jersey household state income tax uses filing-threshold zero-out.
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      person1:
        age: 40
        taxable_interest_income: 9_611.82
        short_term_capital_gains: 42.93
        long_term_capital_gains: 314.91
        is_tax_unit_head: true
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: NJ
  output:
    nj_income_tax: 0
    household_state_income_tax: 0
