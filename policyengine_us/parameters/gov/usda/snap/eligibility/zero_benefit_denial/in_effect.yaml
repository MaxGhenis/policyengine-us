description: Whether the state denies the Supplemental Nutrition Assistance Program application of an eligible household with three or more members whose benefit computes to zero, rather than certifying the household and suspending its participation.
metadata:
  unit: bool
  period: year
  label: SNAP zero-benefit denial for households of three or more
  propagate_metadata_to_children: true
  breakdown:
    - state_code
  reference:
    - title: 7 CFR 273.10(e)(2)(iii) - Households entitled to no benefits
      href: https://www.ecfr.gov/current/title-7/section-273.10#p-273.10(e)(2)(iii)
    - title: "Food Stamp Program final rule, 65 FR 70134 (November 21, 2000) #page 1,28"
      href: https://www.govinfo.gov/content/pkg/FR-2000-11-21/pdf/00-29355.pdf#page=1
    - title: CDSS ACIN I-50-13, Traditional and Modified Categorical Eligibility
      href: https://www.cdss.ca.gov/lettersnotices/entres/getinfo/acin/2013/I-50_13.pdf#page=2
    - title: CDSS ACL 14-56, CalFresh Modified Categorical Eligibility
      href: https://www.cdss.ca.gov/lettersnotices/entres/getinfo/acl/2014/14-56.pdf#page=6
    - title: CDSS ACL 14-63, Households Eligible for CalFresh, but Entitled to No Benefits
      href: https://www.cdss.ca.gov/lettersnotices/entres/getinfo/acl/2014/14-63.pdf#page=2
    - title: California MPP 63-503.329
      href: https://www.cdss.ca.gov/ord/entres/getinfo/pdf/fsman06.pdf#page=36
# Under 7 CFR 273.10(e)(2)(iii), a state either (A) denies these households
# or (B) certifies them and suspends their participation. Until January 20,
# 2001, states could not deny categorically eligible households (65 FR 70134,
# 70161). Only California's election is modeled. A false entry keeps the
# model's treatment of these households as eligible for a zero benefit; it is
# not a finding that the state certifies and suspends them.
# California: ACIN I-50-13 (August 23, 2013) first states that California
# "has opted to deny such cases", including households that are otherwise
# categorically eligible (CE) or Modified Categorically Eligible (MCE).
# ACL 14-56 and ACL 14-63 restate the election, have ongoing cases
# discontinued, and apply it to traditional CE and MCE households alike.
# MPP 63-503.329(b), last amended in 2005, still exempts households that are
# categorically eligible under MPP 63-301.7 (PA) and .82 (GA), as the federal
# rule required before 2001. This parameter follows the later CDSS letters.
