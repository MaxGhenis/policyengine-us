description: Missouri subtracts these sources from federal adjusted gross income to determine state adjusted gross income.
values:
  2008-01-01:
    - mo_qualified_health_insurance_premiums
    - us_govt_interest_person
    - mo_529_deduction
    - salt_refund_income # 143.121 RSMo / Form MO-A Line 9
  # From 2021 the taxable military pension is subtracted on Form MO-A Part 1
  # line 10; before 2021 it was a partial exemption on Part 3 Section D, which
  # is not modeled.
  2021-01-01:
    - mo_qualified_health_insurance_premiums
    - us_govt_interest_person
    - mo_529_deduction
    - salt_refund_income # 143.121 RSMo / Form MO-A Line 9
    - military_retirement_pay # Form MO-A Line 10
  2025-01-01:
    - mo_qualified_health_insurance_premiums
    - mo_capital_gains_subtraction_person
    - us_govt_interest_person
    - mo_529_deduction
    - salt_refund_income # 143.121 RSMo / Form MO-A Line 9
    - military_retirement_pay # Form MO-A Line 10


