description: Rhode Island subtracts these retirement income sources from adjusted gross income under the individual income tax retirement income subtraction program.
values:
  2021-01-01:
    - taxable_pension_income
    - taxable_401k_distributions
    - taxable_403b_distributions
  2023-01-01:
    # From 2023, military service pensions are modified out in full under
    # 44-30-12(c)(11), and income used for that modification is excluded here.
    - taxable_public_pension_income
    - taxable_private_pension_income
    - taxable_401k_distributions
    - taxable_403b_distributions
