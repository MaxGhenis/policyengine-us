description: Oklahoma subtracts these retirement benefits from adjusted gross income under the individual income tax pension subtraction program.
values:
  2021-01-01:
    # Military retirement is excluded in full on Schedule 511-A line 4; lines 5 and 6 cover other retirement benefits.
    - taxable_public_pension_income
    - taxable_private_pension_income
    - taxable_retirement_distributions
    - taxable_roth_conversions
