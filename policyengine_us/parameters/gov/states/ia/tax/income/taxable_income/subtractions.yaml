description: Iowa subtracts these sources from taxable income on and after 2023.
values:
  2021-01-01:
    # Line 1B
    - us_govt_interest
    # Dividends from federal securities
    # Line 5B 
    - taxable_social_security
    # Line 6B
    - military_service_income
    # Line 7B
    - ia_pension_exclusion
    # Railroad unemployment income
    # Bonus Depreciation
    # Iowa Health Insurance Deduction
    # Iowa capital gains deduction
    - ia_529_plan_subtraction
  # Iowa Code 422.7(20) excludes military retirement pay regardless of age.
  # The 2023 IA 1040 reported it inside line 7; from 2024 it has its own line.
  2023-01-01:
    # Line 1B
    - us_govt_interest
    # Dividends from federal securities
    # Line 4B
    - military_retirement_pay 
    # Line 5B 
    - taxable_social_security
    # Line 6B
    - military_service_income
    # Line 7B
    - ia_pension_exclusion
    # Railroad unemployment income
    # Bonus Depreciation
    # Iowa Health Insurance Deduction
    # Iowa capital gains deduction
    - ia_529_plan_subtraction

