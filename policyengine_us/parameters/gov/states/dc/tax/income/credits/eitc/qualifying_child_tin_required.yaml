description: The District of Columbia treats a filer whose qualifying children all lack a Social Security number or individual taxpayer identification number as a filer without a qualifying child under its earned income tax credit if this is true.
values:
  # From 2023 the D-40 Line 27a instructions require a Social Security number
  # or ITIN for each qualifying child and send a filer whose children have
  # neither to the childless schedule. Earlier booklets set no identification
  # test for children, and (f)(4) with IRC 32(c)(3)(D) could keep such a child
  # a qualifying child. The model applies the childless treatment to those
  # years too; from 2021 it matches ARPA section 9622, which the 2021 D-40
  # booklet describes as making such a filer eligible for the childless credit.
  2015-01-01: true
