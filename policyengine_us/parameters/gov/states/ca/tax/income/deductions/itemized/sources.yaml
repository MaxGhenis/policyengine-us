description: California counts these deductions as itemized deductions before the high-income limitation.
values:
  2013-01-01:
    - medical_expense_deduction # Schedule CA (540), Part II, line 4
    - real_estate_taxes # line 5b (line 5a state income taxes are subtracted in column B)
    - interest_deduction # lines 8 and 9, net of federal investment interest (subtracted in the formula)
    - ca_investment_interest_expense_deduction # line 9, as figured on FTB 3526
    - ca_charitable_deduction # lines 11 through 14
    - casualty_loss_deduction # line 15
    - ca_misc_deduction # lines 19 through 25
