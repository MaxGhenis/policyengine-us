description: California limits charitable contribution deductions to this share of federal adjusted gross income.
values:
  2013-01-01: 0.5
metadata:
  unit: /1
  period: year
  label: California charitable contribution deduction ceiling
  reference:
    # R&TC 17201(a) adopts IRC Part VI, including section 170, as of the
    # specified date in R&TC 17024.5(a)(1): January 1, 2009 for 2010-2014,
    # January 1, 2015 for 2015-2024, and January 1, 2025 from 2025. IRC
    # 170(b)(1)(A) sets a 50% limit. The 60% cash limit in IRC 170(b)(1)(G)
    # postdates the 2009 and 2015 specified dates, and R&TC 17250.1(b)
    # disapplies it from 2025. R&TC 17024.5(h)(2)(A) makes the base federal
    # adjusted gross income.
