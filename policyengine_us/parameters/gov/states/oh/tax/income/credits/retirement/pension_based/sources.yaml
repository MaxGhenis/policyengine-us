description: Ohio includes these income sources under the pension-based retirement income credit program. Under R.C. 5747.055(A)(1), distributions must be received on account of retirement; modeled including all distributions without checking retirement event condition.
values:
  2021-01-01:
    # Uniformed services retirement income deducted on the Schedule of Adjustments does not qualify for this credit.
    - taxable_public_pension_income
    - taxable_private_pension_income
    - taxable_retirement_distributions
