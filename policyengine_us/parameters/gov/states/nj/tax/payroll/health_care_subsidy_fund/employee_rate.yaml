description: New Jersey requires employees to contribute this share of taxable wages to the Health Care Subsidy Fund.
values:
  # 0.20% from January 1, 2000 until June 30, 2004. Earlier years reuse this
  # rate so the parameter resolves in every period. The statute set other
  # rates for 1993 through 1999 (0.30% in 1998 and 0.25% in 1999, for
  # example), which are not modeled.
  0000-01-01: 0.002
  # P.L. 2004, c.45 ended worker contributions to the fund on June 30, 2004,
  # and raised the worker unemployment insurance rate by the same 0.20%.
  2004-07-01: 0

