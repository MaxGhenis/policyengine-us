description: New Jersey limits wages subject to employee and employer unemployment insurance contributions, employee Health Care Subsidy Fund contributions, and employee workforce fund contributions to this amount per person.
values:
  # Published bases are verified from 2000 (21,200). Earlier years reuse the
  # 2000 base, like the undated earliest entries of the other jurisdictions,
  # because the all-jurisdiction state unemployment tax helper reads every
  # jurisdiction's base in every period, whatever the household's state.
  0000-01-01: 21_200
  2001-01-01: 22_100
  2002-01-01: 23_500
  2003-01-01: 23_900
  2004-01-01: 24_300
  2005-01-01: 24_900
  2006-01-01: 25_800
  2007-01-01: 26_600
  2008-01-01: 27_700
  2009-01-01: 28_900
  2010-01-01: 29_700
  # NJDOL and U.S. DOL both publish a 2011 base below the 2010 base.
  2011-01-01: 29_600
  2012-01-01: 30_300
  2013-01-01: 30_900
  2014-01-01: 31_500
  2015-01-01: 32_000
  2016-01-01: 32_600
  2017-01-01: 33_500
  2018-01-01: 33_700
  2019-01-01: 34_400
  2020-01-01: 35_300
  2021-01-01: 36_200
  2022-01-01: 39_800
  2023-01-01: 41_100
  2024-01-01: 42_300
  2025-01-01: 43_300
  2026-01-01: 44_800
  2027-01-01: 46_400

