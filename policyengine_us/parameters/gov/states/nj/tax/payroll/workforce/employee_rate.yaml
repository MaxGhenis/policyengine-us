description: New Jersey requires employees to contribute this share of taxable wages to the Workforce Development Partnership Fund and the Supplemental Workforce Fund for Basic Skills combined.
values:
  # Workforce Development Partnership Fund only: 0.025% in NJDOL's 2001 worker
  # rates. Earlier years reuse this rate so the parameter resolves in every
  # period; worker rates before 2001 are not verified.
  0000-01-01: 0.00025
  # N.J.S.A. 34:15D-22 adds 0.0175% for the Supplemental Workforce Fund from
  # January 1, 2002, for a combined WF/SWF rate of 0.0425%.
  2002-01-01: 0.000425

