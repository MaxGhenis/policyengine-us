description: PolicyEngine uses this population-weighted average combined state and local general sales tax rate, derived from Tax Foundation data, as each state's default combined sales tax rate. It is a PolicyEngine default, not an IRS or statutory value.
metadata:
  unit: /1
  period: year
  breakdown:
  - state_code
  label: Average combined state and local sales tax rate (PolicyEngine default from Tax Foundation data)
  reference:
    - title: Tax Foundation, State & Local Sales Tax Rates, as of January 1, 2022
      href: https://taxfoundation.org/data/all/state/2022-sales-taxes/
    - title: Tax Foundation, State & Local Sales Tax Rates as of July 1, 2022
      href: https://taxfoundation.org/data/all/state/2022-sales-tax-rates-midyear/
    - title: Tax Foundation, State & Local Sales Tax Rates, as of January 1, 2023
      href: https://taxfoundation.org/data/all/state/2023-sales-taxes/
    - title: Tax Foundation, State & Local Sales Tax Rates as of July 1, 2023
      href: https://taxfoundation.org/data/all/state/2023-sales-tax-rates-midyear/
    - title: Tax Foundation, State and Local Sales Tax Rates, 2024 (as of January 1, 2024)
      href: https://taxfoundation.org/data/all/state/2024-sales-taxes/
    - title: Tax Foundation, State & Local Sales Tax Rates as of July 1, 2024
      href: https://taxfoundation.org/data/all/state/2024-sales-tax-rates-midyear/
    - title: Tax Foundation, Combined State & Average Local Sales Tax Rates, January 2025 (as of January 1, 2025)
      href: https://taxfoundation.org/data/all/state/sales-tax-rates-2025/
    - title: Tax Foundation, State & Local Sales Tax Rates as of July 1, 2025
      href: https://taxfoundation.org/data/all/state/sales-tax-rates-midyear-2025/
    - title: Tax Foundation, State & Local Sales Tax Rates as of January 1, 2026
