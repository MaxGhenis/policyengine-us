    - title: Tax Foundation work is licensed under CC BY-NC 4.0; attribution Tax Foundation
      href: https://taxfoundation.org/copyright-notice/
# Each value is the Tax Foundation state rate plus its population-weighted
# average local rate, as of the date shown, divided by 100 and rounded to six
# decimals. The full-precision values come from each edition's XLSX; the
# January 1, 2024 edition has no XLSX, so it uses the web table (average local
# rate to three decimals). Tax Foundation includes the statewide local add-ons
# of California, Utah, and Virginia in its state rate, and represents New
# Jersey's reduced-rate areas (Salem County, Urban Enterprise Zones) as a
# negative average local rate.
